<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDG 永續桌遊 + AI (Advance強化) | iGEM Wiki</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #22c55e;
    --accent2: #3b82f6;
    --danger: #ef4444;
    --warn: #f59e0b;
    --neg: #e63946;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  .screen { display: none; padding: 20px; max-width: 1400px; margin: 0 auto; }
  .screen.active { display: block; }
  h1 { text-align: center; margin-bottom: 20px; color: var(--accent); }
  h2 { margin: 15px 0 10px; color: var(--accent2); font-size: 1.2rem; }
  button {
    background: var(--accent2);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: 0.2s;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.danger { background: var(--danger); }
  button.warn { background: var(--warn); color: #111; }
  button.success { background: var(--accent); color: #111; }
  input, select {
    background: var(--card);
    border: 1px solid #334155;
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.95rem;
  }
  .setup-box {
    background: var(--card);
    padding: 25px;
    border-radius: 12px;
    max-width: 640px;
    margin: 0 auto;
  }
  .player-setup {
    margin: 12px 0;
    display: grid;
    grid-template-columns: 70px 1fr 110px 130px;
    gap: 8px;
    align-items: center;
  }
  .player-setup label { font-size: 0.9rem; color: var(--muted); }

  /* Draft */
  .draft-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin: 16px 0;
  }
  .sdg-pick {
    background: #1e293b;
    border: 2px solid #475569;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    transition: 0.15s;
  }
  .sdg-pick:hover:not(.disabled) { border-color: var(--accent2); transform: translateY(-2px); }
  .sdg-pick.disabled { opacity: 0.35; cursor: not-allowed; border-color: #334155; }
  .sdg-pick.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .draft-status { text-align: center; margin: 12px 0; font-size: 1.1rem; color: var(--accent); }

  .game-layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 16px;
  }
  @media (max-width: 1000px) {
    .game-layout { grid-template-columns: 1fr; }
  }
  .board {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
  }
  .players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .player-card {
    background: #0f172a;
    border: 2px solid #334155;
    border-radius: 10px;
    padding: 12px;
    position: relative;
  }
  .player-card.current {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(34,197,94,0.3);
  }
  .player-card.sanctioned::after {
    content: "制裁中";
    position: absolute;
    top: 6px; right: 8px;
    background: var(--danger);
    color: white;
    font-size: 0.7rem;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .player-card.ai-tag::before {
    content: "AI";
    position: absolute;
    top: 6px; left: 8px;
    background: #7c3aed;
    color: white;
    font-size: 0.65rem;
    padding: 1px 5px;
    border-radius: 3px;
  }
  .player-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 8px; padding-left: 28px; }
  .sdg-row {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
    align-items: center;
  }
  .sdg-badge {
    background: #1e3a5f;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.85rem;
    min-width: 70px;
    text-align: center;
  }
  .sdg-badge.goal { background: #166534; color: #bbf7d0; }
  .sdg-badge.frozen { outline: 2px solid #38bdf8; }
  .progress-bar {
    flex: 1;
    height: 18px;
    background: #1e293b;
    border-radius: 9px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #22c55e, #4ade80);
    transition: width 0.3s;
  }
  .progress-fill.negative {
    background: linear-gradient(90deg, #e63946, #ff6b6b);
  }
  .progress-preview {
    position: absolute;
    top: 0; bottom: 0;
    background: repeating-linear-gradient(
      90deg,
      rgba(34,197,94,0.35),
      rgba(34,197,94,0.35) 4px,
      rgba(34,197,94,0.15) 4px,
      rgba(34,197,94,0.15) 8px
    );
    border: 2px dashed #4ade80;
    border-radius: 9px;
    pointer-events: none;
    transition: all 0.25s;
  }
  .progress-preview.negative {
    background: repeating-linear-gradient(
      90deg,
      rgba(230,57,70,0.4),
      rgba(230,57,70,0.4) 4px,
      rgba(230,57,70,0.18) 4px,
      rgba(230,57,70,0.18) 8px
    );
    border-color: #e63946;
  }
  .progress-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 600;
    z-index: 2;
  }

  .hand-area {
    background: #0f172a;
    border-radius: 10px;
    padding: 12px;
    margin-top: 12px;
  }
  .hand-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 110px;
  }
  .card {
    background: #1e293b;
    border: 2px solid #475569;
    border-radius: 8px;
    padding: 8px;
    width: 150px;
    font-size: 0.78rem;
    cursor: pointer;
    transition: 0.15s;
    position: relative;
  }
  .card:hover { border-color: var(--accent2); transform: translateY(-2px); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .card.disabled-card { opacity: 0.4; cursor: not-allowed; }
  .card.event { border-left: 4px solid #f59e0b; }
  .card.special { border-left: 4px solid #a855f7; }
  .card-name { font-weight: 700; margin-bottom: 4px; color: #f1f5f9; }
  .card-effect { color: var(--muted); font-size: 0.72rem; }
  .card-fwd { color: #4ade80; }
  .card-bwd { color: #f87171; }

  .deck-info {
    display: flex;
    gap: 16px;
    margin: 12px 0;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .phase-bar {
    background: #1e3a5f;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .phase-label { font-weight: 600; color: var(--accent); }
  .ai-thinking {
    color: #c4b5fd;
    font-weight: 600;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .log-panel {
    background: var(--card);
    border-radius: 12px;
    padding: 14px;
    height: calc(100vh - 40px);
    max-height: 900px;
    display: flex;
    flex-direction: column;
  }
  .log-content {
    flex: 1;
    overflow-y: auto;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .log-entry { padding: 4px 0; border-bottom: 1px solid #1e293b; }
  .log-entry.sys { color: var(--accent2); }
  .log-entry.win { color: var(--accent); font-weight: 700; }
  .log-entry.ai { color: #c4b5fd; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 12px;
    padding: 24px;
    max-width: 480px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h3 { margin-bottom: 14px; color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

  .win-screen {
    text-align: center;
    padding: 60px 20px;
  }
  .win-screen h1 { font-size: 2.5rem; color: var(--accent); }

  .confirm-bar {
    margin-top: 12px;
    display: flex;
    gap: 10px;
    justify-content: center;
  }
</style>
</head>

<div id="setupScreen" class="screen active">

  <div class="setup-box">

</div>

<!-- Game Screen -->

      </div>

      <div class="players-grid" id="playersGrid"></div>

      <div class="deck-info">
        <span>抽牌堆：<strong id="deckCount">0</strong></span>
        <span>棄牌堆：<strong id="discardCount">0</strong></span>
        <span id="playStatus"></span>
      </div>

      <div class="hand-area">
        <h2>目前玩家手牌 <span id="handCount"></span></h2>
        <div class="hand-cards" id="handCards"></div>
        <div class="confirm-bar" id="confirmBar" style="display:none;">
          <button id="btnConfirmAction" class="success">確認執行行動</button>
        </div>
      </div>
    </div>

    <div class="log-panel">
      <h2>遊戲歷程</h2>
      <div class="log-content" id="logContent"></div>
    </div>
  </div>
</div>

<!-- Win Screen -->
<div id="winScreen" class="screen">
  <div class="win-screen">
    <h1>🏆 勝利！</h1>
    <p id="winnerText" style="font-size:1.4rem;margin:20px 0;"></p>
    <button onclick="location.reload()" class="success">再玩一次</button>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

/* ==================== Game State ==================== */
let state = {
  players: [],
  currentPlayer: 0,
  phase: "action",
  deck: [],
  discard: [],
  unusedSDGs: [],
  selectedCards: [],
  mode: null,
  playCount: 0,
  maxPlay: 2,
  capacityActive: false,
  isAIThinking: false,
  draftAvailable: [],
  draftCurrentPlayer: 0,
  draftPickCount: 0,
  draftSelected: null,
  previewDeltas: {}
};

/* ==================== Utils ==================== */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function log(msg, type = "") {
  const el = document.getElementById("logContent");
  const div = document.createElement("div");
  div.className = "log-entry " + type;
  div.textContent = msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function showModal(title, bodyHtml, actions) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = bodyHtml;
  const act = document.getElementById("modalActions");
  act.innerHTML = "";
  (actions || []).forEach(a => {
    const btn = document.createElement("button");
    btn.textContent = a.label;
    if (a.class) btn.className = a.class;
    btn.onclick = () => { hideModal(); a.fn(); };
    act.appendChild(btn);
  });
  document.getElementById("modal").classList.add("show");
}
function hideModal() {
  document.getElementById("modal").classList.remove("show");
}
function getCurrentPlayer() {
  return state.players[state.currentPlayer];
}
function delay(ms) {
  return new Promise(r => setTimeout(r, ms));
}
function randChoice(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

/* ==================== Setup ==================== */
function renderNameInputs() {
  const count = +document.getElementById("playerCount").value;
  const box = document.getElementById("nameInputs");
  box.innerHTML = "";
  for (let i = 0; i < count; i++) {
    const div = document.createElement("div");
    div.className = "player-setup";
    div.innerHTML = `
      <label>玩家 ${i+1}</label>
      <input type="text" id="pname${i}" value="${i===0?'玩家1':'AI'+(i)}" maxlength="12">
      <select id="ptype${i}">
        <option value="human"${i===0?' selected':''}>人類</option>
        <option value="ai"${i>0?' selected':''}>AI 機器人</option>
      </select>
      <select id="pdiff${i}" ${i===0?'disabled':''}>
        <option value="easy">Easy 簡單</option>
        <option value="basic" selected>Basic 中等</option>
        <option value="advance">Advance 困難</option>
      </select>
    `;
    box.appendChild(div);
    document.getElementById("ptype"+i).addEventListener("change", function() {
      document.getElementById("pdiff"+i).disabled = this.value === "human";
    });
  }
}
document.getElementById("playerCount").addEventListener("change", renderNameInputs);
renderNameInputs();

document.getElementById("startBtn").addEventListener("click", startDraft);

function startDraft() {
  const count = +document.getElementById("playerCount").value;
  const names = [], types = [], diffs = [];
  for (let i = 0; i < count; i++) {
    names.push(document.getElementById("pname"+i).value.trim() || `玩家${i+1}`);
    types.push(document.getElementById("ptype"+i).value);
    diffs.push(document.getElementById("pdiff"+i).value);
  }

  state.players = names.map((name, idx) => ({
    name,
    isAI: types[idx] === "ai",
    difficulty: diffs[idx],
    sdgs: [],
    hand: [],
    sanctioned: false,
    capacityNext: false
  }));

  state.draftAvailable = Array.from({length:17}, (_,i) => i+1);
  shuffle(state.draftAvailable);
  state.draftCurrentPlayer = 0;
  state.draftPickCount = 0;
  state.draftSelected = null;

  document.getElementById("setupScreen").classList.remove("active");
  document.getElementById("draftScreen").classList.add("active");
  renderDraft();
}

function renderDraft() {
  const p = state.players[state.draftCurrentPlayer];
  const pickNum = state.draftPickCount + 1;
  document.getElementById("draftStatus").textContent =
    `輪到 ${p.name}${p.isAI?" (AI)":""} 挑選第 ${pickNum} 張 SDG`;

  const grid = document.getElementById("draftGrid");
  grid.innerHTML = "";
  for (let id = 1; id <= 17; id++) {
    const available = state.draftAvailable.includes(id);
    const div = document.createElement("div");
    div.className = "sdg-pick" + (!available ? " disabled" : "") + (state.draftSelected === id ? " selected" : "");
    div.innerHTML = `<strong>SDG ${id}</strong><br><span style="font-size:0.8rem;color:#94a3b8;">${SDG_NAMES[id]}</span>`;
    if (available && !p.isAI) {
      div.onclick = () => {
        state.draftSelected = id;
        document.getElementById("btnConfirmDraft").disabled = false;
        renderDraft();
      };
    }
    grid.appendChild(div);
  }

  let picksHtml = state.players.map(pl => {
    const s = pl.sdgs.map(x => `SDG ${x.id}`).join(", ") || "尚未選擇";
    return `${pl.name}: ${s}`;
  }).join(" ｜ ");
  document.getElementById("draftPicks").textContent = picksHtml;

  document.getElementById("btnConfirmDraft").disabled = !state.draftSelected || p.isAI;

  if (p.isAI) {
    setTimeout(() => aiDraftPick(), 800 + Math.random()*600);
  }
}

document.getElementById("btnConfirmDraft").onclick = () => {
  if (!state.draftSelected) return;
  confirmDraftPick(state.draftSelected);
};

function confirmDraftPick(id) {
  const p = state.players[state.draftCurrentPlayer];
  p.sdgs.push({ id, progress: 0, frozen: false, immune: false });
  state.draftAvailable = state.draftAvailable.filter(x => x !== id);
  state.draftSelected = null;
  state.draftPickCount++;

  if (state.draftPickCount >= 2) {
    state.draftPickCount = 0;
    state.draftCurrentPlayer++;
    if (state.draftCurrentPlayer >= state.players.length) {
      startGameAfterDraft();
      return;
    }
  }
  renderDraft();
}

function aiDraftPick() {
  const p = state.players[state.draftCurrentPlayer];
  if (!p.isAI || state.draftAvailable.length === 0) return;
  let choice;
  if (p.difficulty === "easy") {
    choice = randChoice(state.draftAvailable);
  } else {
    const weighted = state.draftAvailable.slice().sort((a,b) => Math.abs(a-8.5) - Math.abs(b-8.5));
    choice = weighted[Math.floor(Math.random() * Math.min(6, weighted.length))];
  }
  state.draftSelected = choice;
  renderDraft();
  setTimeout(() => confirmDraftPick(choice), 500);
}

function startGameAfterDraft() {
  state.unusedSDGs = [...state.draftAvailable];
  shuffle(state.unusedSDGs);

  state.deck = [];
  eventCards.forEach(c => state.deck.push({ ...c, kind: "event", id: Math.random().toString(36).slice(2) }));
  specialCards.forEach(c => {
    for (let i = 0; i < 2; i++) {
      state.deck.push({ ...c, kind: "special", id: Math.random().toString(36).slice(2) + i });
    }
  });
  shuffle(state.deck);
  state.discard = [];

  state.players.forEach(p => {
    for (let i = 0; i < 5; i++) {
      if (state.deck.length === 0) reshuffle();
      p.hand.push(state.deck.pop());
    }
  });

  state.currentPlayer = 0;
  state.phase = "action";
  state.mode = null;
  state.selectedCards = [];
  state.playCount = 0;
  state.maxPlay = 2;
  state.capacityActive = false;
  state.isAIThinking = false;
  state.previewDeltas = {};

  document.getElementById("draftScreen").classList.remove("active");
  document.getElementById("gameScreen").classList.add("active");
  log(`SDG 挑選完成，遊戲開始！`, "sys");
  log(`請 ${getCurrentPlayer().name} 開始行動。`, "sys");
  updateUI();
  maybeTriggerAI();
}

function reshuffle() {
  if (state.discard.length === 0) return;
  state.deck = state.discard.splice(0);
  shuffle(state.deck);
  log("抽牌堆用盡，棄牌堆已洗牌重來。", "sys");
}

/* ==================== Preview Logic ==================== */
function computePreview() {
  state.previewDeltas = {};
  const p = getCurrentPlayer();
  if (state.mode !== "play" || state.selectedCards.length === 0 || p.isAI) return;

  state.selectedCards.forEach(idx => {
    const card = p.hand[idx];
    if (!card || card.kind !== "event") return;
    card.forward.forEach(sdgId => {
      state.players.forEach((pl, pi) => {
        pl.sdgs.forEach((s, si) => {
          if (s.id === sdgId && s.progress < 3 && !s.frozen) {
            if (!state.previewDeltas[pi]) state.previewDeltas[pi] = {};
            state.previewDeltas[pi][si] = (state.previewDeltas[pi][si] || 0) + 1;
          }
        });
      });
    });
    card.backward.forEach(sdgId => {
      state.players.forEach((pl, pi) => {
        pl.sdgs.forEach((s, si) => {
          if (s.id === sdgId && s.progress < 3 && !s.frozen && !s.immune) {
            if (!state.previewDeltas[pi]) state.previewDeltas[pi] = {};
            state.previewDeltas[pi][si] = (state.previewDeltas[pi][si] || 0) - 1;
          }
        });
      });
    });
  });
}

/* ==================== UI Update ==================== */
function updateUI() {
  const p = getCurrentPlayer();
  document.getElementById("turnInfo").textContent = `目前回合：${p.name}${p.isAI ? " (AI)" : ""}`;
  document.getElementById("deckCount").textContent = state.deck.length;
  document.getElementById("discardCount").textContent = state.discard.length;
  document.getElementById("handCount").textContent = `(${p.hand.length}/5)`;

  let phaseText = "行動階段：請選擇「棄牌」或「打出卡牌」";
  if (state.isAIThinking) phaseText = "AI 思考中...";
  else if (state.mode === "discard") phaseText = "棄牌模式：選擇要棄掉的手牌，再按確認";
  else if (state.mode === "play") phaseText = `打牌模式：選擇最多 ${state.maxPlay} 張牌，再按確認`;
  else if (state.phase === "draw") phaseText = "補牌階段";
  document.getElementById("phaseLabel").textContent = phaseText;
  document.getElementById("phaseLabel").className = "phase-label" + (state.isAIThinking ? " ai-thinking" : "");

  const btnDiscard = document.getElementById("btnDiscardMode");
  const btnPlay = document.getElementById("btnPlayMode");
  const btnCancel = document.getElementById("btnCancelAction");
  const confirmBar = document.getElementById("confirmBar");

  const humanTurn = !p.isAI && state.phase === "action" && !state.isAIThinking;

  if (humanTurn && !state.mode) {
    btnDiscard.style.display = "";
    btnPlay.style.display = "";
    btnCancel.style.display = "none";
    confirmBar.style.display = "none";
  } else if (humanTurn && (state.mode === "discard" || state.mode === "play")) {
    btnDiscard.style.display = "none";
    btnPlay.style.display = "none";
    btnCancel.style.display = "";
    confirmBar.style.display = state.selectedCards.length > 0 ? "flex" : "none";
  } else {
    btnDiscard.style.display = "none";
    btnPlay.style.display = "none";
    btnCancel.style.display = "none";
    confirmBar.style.display = "none";
  }

  computePreview();

  const grid = document.getElementById("playersGrid");
  grid.innerHTML = "";
  state.players.forEach((pl, idx) => {
    const div = document.createElement("div");
    div.className = "player-card" +
      (idx === state.currentPlayer ? " current" : "") +
      (pl.sanctioned ? " sanctioned" : "") +
      (pl.isAI ? " ai-tag" : "");
    let html = `<div class="player-name">${pl.name}${idx === state.currentPlayer ? " ▶" : ""}${pl.isAI ? " ["+pl.difficulty+"]" : ""}</div>`;
    pl.sdgs.forEach((s, si) => {
      const cur = s.progress;
      const delta = (state.previewDeltas[idx] && state.previewDeltas[idx][si]) || 0;
      const preview = clamp(cur + delta, -2, 3);
      const pct = ((cur + 2) / 5) * 100;
      const previewPct = ((preview + 2) / 5) * 100;
      const goal = cur >= 3;
      const isNeg = cur < 0;
      const previewNeg = preview < 0 || (delta < 0 && preview <= cur);
      html += `<div class="sdg-row">
        <div class="sdg-badge ${goal ? "goal" : ""} ${s.frozen ? "frozen" : ""}">SDG ${s.id}</div>
        <div class="progress-bar">
          <div class="progress-fill ${isNeg ? "negative" : ""}" style="width:${pct}%"></div>
          ${delta !== 0 ? `<div class="progress-preview ${delta < 0 ? "negative" : ""}" style="left:0;width:${Math.max(pct, previewPct)}%;"></div>` : ""}
          <div class="progress-text">${cur >= 3 ? "GOAL" : cur}${delta ? ` →${preview}` : ""}${s.frozen ? " ❄" : ""}${s.immune ? " 🛡" : ""}</div>
        </div>
      </div>
      <div style="font-size:0.7rem;color:#64748b;margin-bottom:4px;">${SDG_NAMES[s.id] || ""}</div>`;
    });
    div.innerHTML = html;
    grid.appendChild(div);
  });

  const handEl = document.getElementById("handCards");
  handEl.innerHTML = "";
  p.hand.forEach((card, idx) => {
    const isVeto = card.kind === "special" && card.type === "veto";
    const cannotPlay = state.mode === "play" && isVeto;
    const div = document.createElement("div");
    div.className = "card " + (card.kind === "event" ? "event" : "special") +
      (state.selectedCards.includes(idx) ? " selected" : "") +
      (cannotPlay ? " disabled-card" : "");
    let effect = "";
    if (card.kind === "event") {
      const fwd = card.forward.length ? `前進：${card.forward.join(",")}` : "";
      const bwd = card.backward.length ? `後退：${card.backward.join(",")}` : "";
      effect = `<div class="card-fwd">${fwd}</div><div class="card-bwd">${bwd}</div>`;
    } else {
      effect = `<div class="card-effect">${card.desc}</div>`;
    }
    div.innerHTML = `<div class="card-name">${card.name}</div>${effect}<div class="card-effect">${card.desc || ""}</div>`;
    if (!p.isAI && !cannotPlay) {
      div.onclick = () => onCardClick(idx);
    }
    handEl.appendChild(div);
  });
}

/* ==================== Action Handling (Human) ==================== */
document.getElementById("btnDiscardMode").onclick = () => {
  state.mode = "discard";
  state.selectedCards = [];
  updateUI();
};
document.getElementById("btnPlayMode").onclick = () => {
  state.mode = "play";
  state.playCount = 0;
  state.maxPlay = getCurrentPlayer().sanctioned ? 1 : 2;
  state.selectedCards = [];
  updateUI();
  log(`${getCurrentPlayer().name} 進入打牌模式（最多 ${state.maxPlay} 張）。`);
};
document.getElementById("btnCancelAction").onclick = () => {
  state.mode = null;
  state.selectedCards = [];
  state.previewDeltas = {};
  updateUI();
};

document.getElementById("btnConfirmAction").onclick = () => {
  if (state.selectedCards.length === 0) return;
  if (state.mode === "discard") {
    executeDiscard();
  } else if (state.mode === "play") {
    executePlay();
  }
};

function onCardClick(idx) {
  if (state.phase !== "action" || !state.mode || getCurrentPlayer().isAI) return;
  const p = getCurrentPlayer();
  const card = p.hand[idx];
  if (state.mode === "play" && card.kind === "special" && card.type === "veto") return;

  if (state.mode === "discard") {
    const pos = state.selectedCards.indexOf(idx);
    if (pos >= 0) state.selectedCards.splice(pos, 1);
    else state.selectedCards.push(idx);
    updateUI();
    return;
  }

  if (state.mode === "play") {
    const pos = state.selectedCards.indexOf(idx);
    if (pos >= 0) {
      state.selectedCards.splice(pos, 1);
    } else {
      if (state.selectedCards.length >= state.maxPlay) {
        state.selectedCards.shift();
      }
      state.selectedCards.push(idx);
    }
    updateUI();
  }
}

function executeDiscard() {
  const p = getCurrentPlayer();
  const sorted = [...state.selectedCards].sort((a,b) => b - a);
  sorted.forEach(i => {
    const card = p.hand.splice(i, 1)[0];
    state.discard.push(card);
    log(`${p.name} 棄掉了「${card.name}」。`);
  });
  state.selectedCards = [];
  state.mode = null;
  state.previewDeltas = {};
  endActionPhase();
}

async function executePlay() {
  const p = getCurrentPlayer();
  const sorted = [...state.selectedCards].sort((a,b) => b - a);
  const cards = [];
  sorted.forEach(i => {
    cards.unshift(p.hand.splice(i, 1)[0]);
  });
  cards.forEach(c => state.discard.push(c));

  state.selectedCards = [];
  state.mode = null;
  state.previewDeltas = {};
  state.playCount = 0;

  for (const card of cards) {
    log(`${p.name} 打出「${card.name}」。`);
    updateUI();
    await new Promise(resolve => resolveCard(card, false, resolve));
    await delay(300);
  }
  endActionPhase();
}

function endActionPhase() {
  state.mode = null;
  state.selectedCards = [];
  state.previewDeltas = {};
  getCurrentPlayer().sdgs.forEach(s => s.immune = false);
  state.phase = "draw";
  doDrawPhase();
}

function doDrawPhase() {
  const p = getCurrentPlayer();
  let need = 5 - p.hand.length;
  if (p.capacityNext) {
    need += 1;
    p.capacityNext = false;
    state.capacityActive = true;
  }
  const drawn = [];
  for (let i = 0; i < need; i++) {
    if (state.deck.length === 0) reshuffle();
    if (state.deck.length === 0) break;
    drawn.push(state.deck.pop());
  }

  if (state.capacityActive && drawn.length > 0) {
    state.capacityActive = false;
    if (p.isAI) {
      const i = Math.floor(Math.random() * drawn.length);
      const discardOne = drawn.splice(i, 1)[0];
      state.discard.push(discardOne);
      p.hand.push(...drawn);
      log(`${p.name} (AI) 因能力建構額外抽牌後棄置「${discardOne.name}」。`, "ai");
      finishTurn();
    } else {
      showModal("能力建構：請選擇一張棄置",
        drawn.map((c, i) => `<button data-i="${i}" style="margin:4px 0;width:100%;text-align:left;">${c.name}</button>`).join(""),
        []);
      setTimeout(() => {
        document.querySelectorAll("#modalBody button").forEach(btn => {
          btn.onclick = () => {
            const i = +btn.dataset.i;
            const discardOne = drawn.splice(i, 1)[0];
            state.discard.push(discardOne);
            p.hand.push(...drawn);
            log(`${p.name} 因能力建構額外抽牌後棄置「${discardOne.name}」。`);
            hideModal();
            finishTurn();
          };
        });
      }, 50);
    }
  } else {
    p.hand.push(...drawn);
    if (drawn.length) log(`${p.name} 補了 ${drawn.length} 張牌。`);
    finishTurn();
  }
}

function finishTurn() {
  const next = (state.currentPlayer + 1) % state.players.length;
  getCurrentPlayer().sanctioned = false;
  state.players[next].sdgs.forEach(s => s.frozen = false);
  state.currentPlayer = next;
  state.phase = "action";
  state.mode = null;
  state.playCount = 0;
  state.previewDeltas = {};
  log(`── 輪到 ${getCurrentPlayer().name} ──`, "sys");
  checkWin();
  updateUI();
  maybeTriggerAI();
}

/* ==================== AI ==================== */
async function maybeTriggerAI() {
  const p = getCurrentPlayer();
  if (!p.isAI || state.phase !== "action") return;
  state.isAIThinking = true;
  updateUI();
  await delay(1000 + Math.random() * 500);
  await executeAIMove(p);
  state.isAIThinking = false;
}

function getAIBestMove(aiPlayer, difficulty) {
  if (difficulty === "easy") return easyAI(aiPlayer);
  if (difficulty === "basic") return basicAI(aiPlayer);
  return advanceAI(aiPlayer);
}

function easyAI(ai) {
  const play = Math.random() < 0.8;
  if (!play || ai.hand.length === 0) {
    const n = Math.min(ai.hand.length, 1 + Math.floor(Math.random()*2));
    const idxs = shuffle([...Array(ai.hand.length).keys()]).slice(0, n);
    return { action: "discard", indices: idxs };
  }
  const maxP = ai.sanctioned ? 1 : 2;
  const playable = ai.hand.map((c,i) => i).filter(i => !(ai.hand[i].type === "veto"));
  if (playable.length === 0) return { action: "discard", indices: [0] };
  const n = Math.min(playable.length, maxP);
  const idxs = shuffle(playable).slice(0, n);
  return { action: "play", indices: idxs };
}

function basicAI(ai) {
  const scores = ai.hand.map((card, idx) => {
    if (card.type === "veto") return { idx, score: -20 };
    return { idx, score: evalCardBasic(ai, card) };
  });
  scores.sort((a,b) => b.score - a.score);
  const maxP = ai.sanctioned ? 1 : 2;
  if (scores[0] && scores[0].score > 0) {
    const toPlay = scores.filter(s => s.score > -5 && ai.hand[s.idx].type !== "veto").slice(0, maxP).map(s => s.idx);
    if (toPlay.length > 0) return { action: "play", indices: toPlay };
  }
  const worst = scores.slice(-Math.min(2, scores.length)).map(s => s.idx);
  return { action: "discard", indices: worst };
}

function evalCardBasic(ai, card) {
  let score = 0;
  if (card.kind === "event") {
    card.forward.forEach(id => {
      ai.sdgs.forEach(s => { if (s.id === id && s.progress < 3 && !s.frozen) score += 10; });
    });
    card.backward.forEach(id => {
      ai.sdgs.forEach(s => { if (s.id === id && s.progress < 3) score -= 15; });
    });
  } else {
    if (card.type === "freeze" || card.type === "sanction") score += 8;
    if (card.type === "immunity") score += 6;
    if (card.type === "capacity") score += 5;
    if (card.type === "sustain" || card.type === "swapSDG") score += 4;
    if (card.type === "history") score += 3;
    if (card.type === "veto") score = -20;
  }
  return score;
}

/* ========== ADVANCE AI (強化版) ========== */
function advanceAI(ai) {
  const maxP = ai.sanctioned ? 1 : 2;

  // 1. 勝利優先權：檢查是否有組合能直接讓自己兩張 SDG 達 GOAL
  const winCombo = findWinningCombo(ai, maxP);
  if (winCombo) {
    log(`${ai.name} (Advance) 發現直接勝利組合！`, "ai");
    return { action: "play", indices: winCombo };
  }

  // 2. 一般評估
  let highThreat = null; // 對手差1格勝利
  state.players.forEach((pl, pi) => {
    if (pl === ai) return;
    const goals = pl.sdgs.filter(s => s.progress >= 3).length;
    const near = pl.sdgs.some(s => s.progress >= 2);
    if (goals >= 1 && near) highThreat = pi;
  });

  let bestCombo = null;
  let bestScore = -Infinity;
  const n = ai.hand.length;
  const combos = [];
  for (let i = 0; i < n; i++) {
    if (ai.hand[i].type === "veto") continue;
    combos.push([i]);
  }
  if (maxP >= 2) {
    for (let i = 0; i < n; i++) {
      if (ai.hand[i].type === "veto") continue;
      for (let j = i + 1; j < n; j++) {
        if (ai.hand[j].type === "veto") continue;
        combos.push([i, j]);
      }
    }
  }

  for (const idxs of combos) {
    let score = evaluateStateAdvance(ai);
    idxs.forEach(idx => {
      score += evalCardAdvance(ai, ai.hand[idx], highThreat);
    });
    // 額外：模擬自己前進後的 GOAL 獎勵
    score += simulateSelfProgressBonus(ai, idxs);
    if (score > bestScore) {
      bestScore = score;
      bestCombo = idxs;
    }
  }

  if (bestScore > evaluateStateAdvance(ai) - 10 && bestCombo) {
    return { action: "play", indices: bestCombo };
  }

  // 棄掉最差的
  const scores = ai.hand.map((c, i) => ({ i, s: evalCardAdvance(ai, c, highThreat) }));
  scores.sort((a, b) => a.s - b.s);
  return { action: "discard", indices: scores.slice(0, Math.min(2, scores.length)).map(x => x.i) };
}

function findWinningCombo(ai, maxP) {
  // 只考慮 event 卡的 forward 效果（最直接能推進自己的方式）
  const n = ai.hand.length;
  const candidates = [];
  for (let i = 0; i < n; i++) {
    if (ai.hand[i].kind === "event") candidates.push([i]);
  }
  if (maxP >= 2) {
    for (let i = 0; i < n; i++) {
      if (ai.hand[i].kind !== "event") continue;
      for (let j = i + 1; j < n; j++) {
        if (ai.hand[j].kind !== "event") continue;
        candidates.push([i, j]);
      }
    }
  }

  for (const idxs of candidates) {
    // 模擬進度
    const sim = ai.sdgs.map(s => ({ id: s.id, progress: s.progress, frozen: s.frozen }));
    idxs.forEach(idx => {
      const card = ai.hand[idx];
      card.forward.forEach(id => {
        sim.forEach(s => {
          if (s.id === id && s.progress < 3 && !s.frozen) {
            s.progress = Math.min(3, s.progress + 1);
          }
        });
      });
    });
    if (sim.every(s => s.progress >= 3)) {
      return idxs;
    }
  }
  return null;
}

function simulateSelfProgressBonus(ai, idxs) {
  let bonus = 0;
  const sim = ai.sdgs.map(s => ({ id: s.id, progress: s.progress, frozen: s.frozen }));
  idxs.forEach(idx => {
    const card = ai.hand[idx];
    if (card.kind !== "event") return;
    card.forward.forEach(id => {
      sim.forEach(s => {
        if (s.id === id && s.progress < 3 && !s.frozen) {
          const before = s.progress;
          s.progress = Math.min(3, s.progress + 1);
          bonus += 25;
          if (before < 3 && s.progress >= 3) bonus += 100;
        }
      });
    });
  });
  return bonus;
}

function evaluateStateAdvance(ai) {
  const myTotal = ai.sdgs.reduce((a, s) => a + s.progress, 0);
  const myGoals = ai.sdgs.filter(s => s.progress >= 3).length;
  let oppMax = 0;
  let threatCount = 0;
  state.players.forEach(pl => {
    if (pl === ai) return;
    const t = pl.sdgs.reduce((a, s) => a + s.progress, 0);
    if (t > oppMax) oppMax = t;
    const goals = pl.sdgs.filter(s => s.progress >= 3).length;
    const near = pl.sdgs.some(s => s.progress >= 2);
    if (goals >= 1 && near) threatCount++;
  });
  const defense = ai.hand.filter(c => c.type === "veto" || c.type === "immunity").length;
  return myTotal * 18 + myGoals * 60 - oppMax * 10 - threatCount * 30 + defense * 8;
}

function evalCardAdvance(ai, card, highThreat) {
  let score = 0;

  if (card.kind === "event") {
    // 自己前進
    card.forward.forEach(id => {
      ai.sdgs.forEach(s => {
        if (s.id === id && s.progress < 3 && !s.frozen) {
          score += 25;
          if (s.progress === 2) score += 40; // 接近 GOAL 額外加分
        }
      });
    });
    // 自己後退（嚴重懲罰）
    card.backward.forEach(id => {
      ai.sdgs.forEach(s => {
        if (s.id === id && s.progress < 3 && !s.immune) score -= 40;
      });
    });
    // 對手後退
    card.backward.forEach(id => {
      state.players.forEach(pl => {
        if (pl === ai) return;
        pl.sdgs.forEach(s => {
          if (s.id === id && s.progress < 3 && !s.frozen && !s.immune) {
            const isThreat = highThreat !== null && state.players[highThreat] === pl;
            score += isThreat ? 80 : 8;
          }
        });
      });
    });
  } else {
    if (card.type === "freeze") {
      // 只在有高威脅時給高分，且目標必須有效
      if (highThreat !== null) score += 70;
      else score += 12;
    } else if (card.type === "sanction") {
      if (highThreat !== null) score += 65;
      else score += 10;
    } else if (card.type === "immunity") {
      score += 15;
    } else if (card.type === "capacity") {
      score += 12;
    } else if (card.type === "sustain" || card.type === "swapSDG") {
      score += 8;
    } else if (card.type === "history") {
      score += 6;
    } else if (card.type === "aid" || card.type === "tradeHand") {
      score += 5;
    } else if (card.type === "veto") {
      score = -100; // 絕對不主動打出
    }
  }
  return score;
}

/* 目標驗證：不可打在 GOAL 或 immune */
function isValidNegativeTarget(s) {
  return s.progress < 3 && !s.immune && !s.frozen;
}

async function executeAIMove(ai) {
  const move = getAIBestMove(ai, ai.difficulty);
  log(`${ai.name} (${ai.difficulty}) 決定：${move.action === "play" ? "打出卡牌" : "棄牌"}`, "ai");

  if (move.action === "discard") {
    const sorted = [...move.indices].sort((a,b) => b-a);
    for (const i of sorted) {
      if (i >= ai.hand.length) continue;
      const card = ai.hand.splice(i, 1)[0];
      state.discard.push(card);
      log(`${ai.name} 棄掉了「${card.name}」。`, "ai");
      await delay(400);
    }
    endActionPhase();
    return;
  }

  const toPlay = [...move.indices].sort((a,b) => b-a);
  const cardsToResolve = [];
  for (const i of toPlay) {
    if (i >= ai.hand.length) continue;
    const card = ai.hand.splice(i, 1)[0];
    state.discard.push(card);
    cardsToResolve.unshift(card);
  }

  for (const card of cardsToResolve) {
    log(`${ai.name} 打出「${card.name}」。`, "ai");
    updateUI();
    await delay(600);
    await new Promise(resolve => resolveCard(card, true, resolve));
    await delay(400);
  }
  endActionPhase();
}

/* ==================== Card Resolution ==================== */
function resolveCard(card, isAI, done) {
  if (card.kind === "event") {
    resolveEvent(card, isAI, done);
  } else {
    resolveSpecial(card, isAI, done);
  }
}

function resolveEvent(card, isAI, done) {
  card.forward.forEach(sdgId => {
    state.players.forEach(pl => {
      pl.sdgs.forEach(s => {
        if (s.id === sdgId && s.progress < 3 && !s.frozen) {
          s.progress = clamp(s.progress + 1, -2, 3);
          log(`${pl.name} 的 SDG ${sdgId} 前進至 ${s.progress}！`);
        }
      });
    });
  });

  if (card.backward.length === 0) {
    done();
    return;
  }

  const targets = [];
  state.players.forEach((pl, pIdx) => {
    pl.sdgs.forEach((s, sIdx) => {
      if (card.backward.includes(s.id) && isValidNegativeTarget(s)) {
        targets.push({ pIdx, sIdx, pl, s });
      }
    });
  });

  if (targets.length === 0) {
    log("後退效果無有效目標。");
    done();
    return;
  }

  let i = 0;
  function nextTarget() {
    if (i >= targets.length) { done(); return; }
    const t = targets[i++];
    const vetoIdx = t.pl.hand.findIndex(c => c.kind === "special" && c.type === "veto");
    if (vetoIdx >= 0) {
      // 精準 Veto：只在自己會後退 或 對手差1格勝利時使用
      const wouldHurtSelf = t.pl === getCurrentPlayer() ? false : true; // 這是被打的人
      const isSelf = t.pl === getCurrentPlayer();
      // 對 Advance：如果是自己的 SDG 被打，或對手即將贏
      let shouldUse = false;
      if (t.pl.isAI && t.pl.difficulty === "advance") {
        const isOwn = true; // 被打的是自己
        const threat = state.players.some(pl => {
          if (pl === t.pl) return false;
          const g = pl.sdgs.filter(s => s.progress >= 3).length;
          return g >= 1 && pl.sdgs.some(s => s.progress >= 2);
        });
        shouldUse = true; // 自己被後退就用
      } else if (t.pl.isAI) {
        shouldUse = t.pl.difficulty === "easy" ? Math.random() < 0.4 :
                    t.pl.difficulty === "basic" ? Math.random() < 0.7 : true;
      }

      if (t.pl.isAI) {
        if (shouldUse) {
          const v = t.pl.hand.splice(vetoIdx, 1)[0];
          state.discard.push(v);
          log(`${t.pl.name} (AI) 使用否決權，抵銷了對 SDG ${t.s.id} 的後退效果！`, "ai");
        } else {
          applyBackward(t);
        }
        nextTarget();
      } else {
        showModal(`否決權！`,
          `<p>${t.pl.name} 的 SDG ${t.s.id} 即將後退。是否使用「否決權」抵銷？</p>`,
          [
            { label: "使用否決權", class: "success", fn: () => {
              const v = t.pl.hand.splice(vetoIdx, 1)[0];
              state.discard.push(v);
              log(`${t.pl.name} 使用否決權，抵銷了對 SDG ${t.s.id} 的後退效果！`);
              nextTarget();
            }},
            { label: "不使用", class: "danger", fn: () => {
              applyBackward(t);
              nextTarget();
            }}
          ]);
      }
    } else {
      applyBackward(t);
      nextTarget();
    }
  }
  nextTarget();
}

function applyBackward(t) {
  t.s.progress = clamp(t.s.progress - 1, -2, 3);
  log(`${t.pl.name} 的 SDG ${t.s.id} 後退至 ${t.s.progress}。`);
}

function askVetoForDirected(attacker, target, cardName, onContinue, onVetoed) {
  const vetoIdx = target.hand.findIndex(c => c.kind === "special" && c.type === "veto");
  if (vetoIdx < 0) {
    onContinue();
    return;
  }
  if (target.isAI) {
    let use = false;
    if (target.difficulty === "advance") {
      // 精準：只在會讓自己受傷或對手即將贏時用
      // 定向卡本身就是對自己不利，所以 Advance 幾乎都用
      use = true;
    } else {
      use = target.difficulty === "easy" ? Math.random() < 0.35 :
            target.difficulty === "basic" ? Math.random() < 0.65 : true;
    }
    if (use) {
      const v = target.hand.splice(vetoIdx, 1)[0];
      state.discard.push(v);
      log(`${target.name} (AI) 使用否決權，抵銷了「${cardName}」！`, "ai");
      bothDrawOne(attacker, target);
      onVetoed();
    } else {
      onContinue();
    }
  } else {
    showModal(`否決權觸發！`,
      `<p>${attacker.name} 正對你使用「${cardName}」。是否消耗【否決權】進行抵銷？</p>
       <p style="font-size:0.85rem;color:#94a3b8;">使用後效果無效，雙方各從牌庫補 1 張。</p>`,
      [
        { label: "使用否決權", class: "success", fn: () => {
          const v = target.hand.splice(vetoIdx, 1)[0];
          state.discard.push(v);
          log(`${target.name} 使用否決權，抵銷了「${cardName}」！`);
          bothDrawOne(attacker, target);
          onVetoed();
        }},
        { label: "不使用", class: "danger", fn: () => onContinue() }
      ]);
  }
}

function bothDrawOne(p1, p2) {
  [p1, p2].forEach(pl => {
    if (state.deck.length === 0) reshuffle();
    if (state.deck.length > 0) {
      pl.hand.push(state.deck.pop());
      log(`${pl.name} 因否決權結算補了 1 張牌。`);
    }
    while (pl.hand.length > 5) {
      const c = pl.hand.pop();
      state.discard.push(c);
      log(`${pl.name} 手牌超過上限，棄置「${c.name}」。`);
    }
  });
}

function resolveSpecial(card, isAI, done) {
  const p = getCurrentPlayer();
  const auto = isAI;

  switch (card.type) {
    case "sustain":
      if (state.unusedSDGs.length === 0) { log("沒有未使用的 SDG 可交換。"); done(); return; }
      if (auto) {
        let si = 0;
        p.sdgs.forEach((s,i) => { if (s.progress < p.sdgs[si].progress) si = i; });
        const old = p.sdgs[si];
        const newId = state.unusedSDGs.pop();
        state.unusedSDGs.push(old.id);
        shuffle(state.unusedSDGs);
        p.sdgs[si] = { id: newId, progress: old.progress, frozen: false, immune: false };
        log(`${p.name} (AI) 將 SDG ${old.id} 換成 SDG ${newId}（步數保留）。`, "ai");
        done();
      } else {
        showModal("永續轉型：選擇要交換的自己 SDG",
          p.sdgs.map((s, i) => `<button data-i="${i}">SDG ${s.id} (${SDG_NAMES[s.id]}) 目前 ${s.progress}</button>`).join(""),
          [{ label: "取消", fn: done }]);
        setTimeout(() => {
          document.querySelectorAll("#modalBody button").forEach(btn => {
            btn.onclick = () => {
              const i = +btn.dataset.i;
              const old = p.sdgs[i];
              const newId = state.unusedSDGs.pop();
              state.unusedSDGs.push(old.id);
              shuffle(state.unusedSDGs);
              p.sdgs[i] = { id: newId, progress: old.progress, frozen: false, immune: false };
              log(`${p.name} 將 SDG ${old.id} 換成 SDG ${newId}（步數保留）。`);
              hideModal();
              done();
            };
          });
        }, 50);
      }
      break;

    case "veto":
      log("否決權已打出（此卡僅能被動使用）。");
      done();
      break;

    case "immunity":
      if (auto) {
        let si = 0;
        p.sdgs.forEach((s,i) => { if (s.progress < p.sdgs[si].progress) si = i; });
        p.sdgs[si].immune = true;
        log(`${p.name} (AI) 的 SDG ${p.sdgs[si].id} 獲得本回合豁免。`, "ai");
        done();
      } else {
        showModal("政策豁免：選擇自己一張 SDG",
          p.sdgs.map((s, i) => `<button data-i="${i}">SDG ${s.id}</button>`).join(""),
          [{ label: "取消", fn: done }]);
        setTimeout(() => {
          document.querySelectorAll("#modalBody button").forEach(btn => {
            btn.onclick = () => {
              const i = +btn.dataset.i;
              p.sdgs[i].immune = true;
              log(`${p.name} 的 SDG ${p.sdgs[i].id} 獲得本回合豁免。`);
              hideModal();
              done();
            };
          });
        }, 50);
      }
      break;

    case "freeze":
      if (auto) {
        // 只選有效目標（非 GOAL、非 immune）
        let best = null;
        state.players.forEach((pl, pi) => {
          if (pl === p) return;
          pl.sdgs.forEach((s, si) => {
            if (isValidNegativeTarget(s) && (!best || s.progress > best.progress)) {
              best = { pi, si, progress: s.progress };
            }
          });
        });
        if (best) {
          const target = state.players[best.pi];
          askVetoForDirected(p, target, "凍結計畫", () => {
            target.sdgs[best.si].frozen = true;
            log(`${p.name} (AI) 凍結了 ${target.name} 的 SDG ${target.sdgs[best.si].id}。`, "ai");
            done();
          }, () => done());
        } else {
          log("無有效凍結目標。");
          done();
        }
      } else {
        let opts = "";
        state.players.forEach((pl, pi) => {
          pl.sdgs.forEach((s, si) => {
            if (isValidNegativeTarget(s)) {
              opts += `<button data-pi="${pi}" data-si="${si}">${pl.name} 的 SDG ${s.id}</button>`;
            }
          });
        });
        if (!opts) { log("無有效凍結目標。"); done(); return; }
        showModal("凍結計畫：選擇要凍結的 SDG", opts, [{ label: "取消", fn: done }]);
        setTimeout(() => {
          document.querySelectorAll("#modalBody button").forEach(btn => {
            btn.onclick = () => {
              const pi = +btn.dataset.pi, si = +btn.dataset.si;
              const target = state.players[pi];
              hideModal();
              askVetoForDirected(p, target, "凍結計畫", () => {
                target.sdgs[si].frozen = true;
                log(`${target.name} 的 SDG ${target.sdgs[si].id} 被凍結。`);
                done();
              }, () => done());
            };
          });
        }, 50);
      }
      break;

    case "tradeHand":
      if (auto) {
        const opps = state.players.map((pl,i) => i).filter(i => i !== state.currentPlayer && state.players[i].hand.length > 0);
        if (opps.length === 0 || p.hand.length === 0) { log("交換失敗。"); done(); return; }
        const ti = randChoice(opps);
        const target = state.players[ti];
        askVetoForDirected(p, target, "合作備忘錄", () => {
          const myIdx = Math.floor(Math.random() * p.hand.length);
          const tIdx = Math.floor(Math.random() * target.hand.length);
          const myCard = p.hand.splice(myIdx, 1)[0];
          const tCard = target.hand.splice(tIdx, 1)[0];
          p.hand.push(tCard);
          target.hand.push(myCard);
          log(`${p.name} (AI) 與 ${target.name} 交換了手牌。`, "ai");
          done();
        }, () => done());
      } else {
        showModal("合作備忘錄：選擇玩家",
          state.players.map((pl, i) => i === state.currentPlayer ? "" : `<button data-i="${i}">${pl.name}</button>`).join(""),
          [{ label: "取消", fn: done }]);
        setTimeout(() => {
          document.querySelectorAll("#modalBody button").forEach(btn => {
            btn.onclick = () => {
              const ti = +btn.dataset.i;
              const target = state.players[ti];
              hideModal();
              askVetoForDirected(p, target, "合作備忘錄", () => {
                if (p.hand.length === 0 || target.hand.length === 0) { log("無手牌可交換。"); done(); return; }
                showModal("選擇自己交出的手牌",
                  p.hand.map((c, i) => `<button data-i="${i}">${c.name}</button>`).join(""), []);
                setTimeout(() => {
                  document.querySelectorAll("#modalBody button").forEach(b2 => {
                    b2.onclick = () => {
                      const myIdx = +b2.dataset.i;
                      hideModal();
                      showModal(`選擇 ${target.name} 交出的手牌`,
                        target.hand.map((c, i) => `<button data-i="${i}">${c.name}</button>`).join(""), []);
                      setTimeout(() => {
                        document.querySelectorAll("#modalBody button").forEach(b3 => {
                          b3.onclick = () => {
                            const tIdx = +b3.dataset.i;
                            const myCard = p.hand.splice(myIdx, 1)[0];
                            const tCard = target.hand.splice(tIdx, 1)[0];
                            p.hand.push(tCard);
                            target.hand.push(myCard);
                            log(`${p.name} 與 ${target.name} 交換了手牌。`);
                            hideModal();
                            done();
                          };
                        });
                      }, 50);
                    };
                  });
                }, 50);
              }, () => done());
            };
          });
        }, 50);
      }
      break;

    case "sanction":
      if (auto) {
        let best = 0, bestScore = -999;
        state.players.forEach((pl, i) => {
          if (pl === p) return;
          const t = pl.sdgs.reduce((a,s) => a + s.progress, 0);
          if (t > bestScore) { bestScore = t; best = i; }
        });
        const target = state.players[best];
        askVetoForDirected(p, target, "國際制裁", () => {
          target.sanctioned = true;
          log(`${p.name} (AI) 制裁了 ${target.name}。`, "ai");
          done();
        }, () => done());
      } else {
        showModal("國際制裁：選擇玩家",
          state.players.map((pl, i) => i === state.currentPlayer ? "" : `<button data-i="${i}">${pl.name}</button>`).join(""),
          [{ label: "取消", fn: done }]);
        setTimeout(() => {
          document.querySelectorAll("#modalBody button").forEach(btn => {
            btn.onclick = () => {
              const i = +btn.dataset.i;
              const target = state.players[i];
              hideModal();
              askVetoForDirected(p, target, "國際制裁", () => {
                target.sanctioned = true;
                log(`${target.name} 下回合最多只能打 1 張牌。`);
                done();
              }, () => done());
            };
          });
        }, 50);
      }
      break;

    case "capacity":
      p.capacityNext = true;
      log(`${p.name}${auto?" (AI)":""} 獲得能力建構。`, auto?"ai":"");
      done();
      break;

    case "aid":
      if (auto) {
        const opps = state.players.map((pl,i) => i).filter(i => i !== state.currentPlayer);
        if (opps.length === 0) { done(); return; }
        const ti = randChoice(opps);
        const target = state.players[ti];
        askVetoForDirected(p, target, "國際援助請求", () => {
          const myIds = p.sdgs.map(s => s.id);
          const candidates = target.hand.map((c,i)=>({c,i})).filter(x => x.c.kind==="event" && x.c.forward.some(f=>myIds.includes(f)));
          if (candidates.length === 0) { log("援助請求失效。"); done(); return; }
          const chosen = randChoice(candidates);
          const card2 = target.hand.splice(chosen.i, 1)[0];
          p.hand.push(card2);
          log(`${target.name} 交出「${card2.name}」給 ${p.name}。`, "ai");
          done();
        }, () => done());
      } else {
        showModal("國際援助請求：選擇玩家",
          state.players.map((pl, i) => i === state.currentPlayer ? "" : `<button data-i="${i}">${pl.name}</button>`).join(""),
          [{ label: "取消", fn: done }]);
        setTimeout(() => {
          document.querySelectorAll("#modalBody button").forEach(btn => {
            btn.onclick = () => {
              const ti = +btn.dataset.i;
              const target = state.players[ti];
              hideModal();
              askVetoForDirected(p, target, "國際援助請求", () => {
                const myIds = p.sdgs.map(s => s.id);
                const candidates = target.hand.map((c,i)=>({c,i})).filter(x => x.c.kind==="event" && x.c.forward.some(f=>myIds.includes(f)));
                if (candidates.length === 0) { log("援助請求失效。"); done(); return; }
                showModal(`請 ${target.name} 交出一張移動牌`,
                  candidates.map(x => `<button data-i="${x.i}">${x.c.name}</button>`).join(""), []);
                setTimeout(() => {
                  document.querySelectorAll("#modalBody button").forEach(b2 => {
                    b2.onclick = () => {
                      const i = +b2.dataset.i;
                      const card2 = target.hand.splice(i, 1)[0];
                      p.hand.push(card2);
                      log(`${target.name} 交出「${card2.name}」給 ${p.name}。`);
                      hideModal();
                      done();
                    };
                  });
                }, 50);
              }, () => done());
            };
          });
        }, 50);
      }
      break;

    case "history":
      if (state.discard.length === 0) { log("棄牌堆是空的。"); done(); return; }
      if (auto) {
        const i = Math.floor(Math.random() * state.discard.length);
        const card2 = state.discard.splice(i, 1)[0];
        p.hand.push(card2);
        log(`${p.name} (AI) 從棄牌堆取回「${card2.name}」。`, "ai");
        done();
      } else {
        showModal("歷史借鏡：選擇一張",
          state.discard.map((c, i) => `<button data-i="${i}">${c.name}</button>`).join(""),
          [{ label: "取消", fn: done }]);
        setTimeout(() => {
          document.querySelectorAll("#modalBody button").forEach(btn => {
            btn.onclick = () => {
              const i = +btn.dataset.i;
              const card2 = state.discard.splice(i, 1)[0];
              p.hand.push(card2);
              log(`${p.name} 從棄牌堆取回「${card2.name}」。`);
              hideModal();
              done();
            };
          });
        }, 50);
      }
      break;

    case "swapSDG":
      if (auto) {
        const opps = state.players.map((pl,i) => i).filter(i => i !== state.currentPlayer);
        if (opps.length === 0) { done(); return; }
        const ti = randChoice(opps);
        const target = state.players[ti];
        askVetoForDirected(p, target, "目標重整", () => {
          let mySi = 0;
          p.sdgs.forEach((s,i) => { if (s.progress < p.sdgs[mySi].progress) mySi = i; });
          let tSi = 0;
          target.sdgs.forEach((s,i) => { if (s.progress > target.sdgs[tSi].progress) tSi = i; });
          const tmp = p.sdgs[mySi];
          p.sdgs[mySi] = target.sdgs[tSi];
          target.sdgs[tSi] = tmp;
          log(`${p.name} (AI) 與 ${target.name} 交換了 SDG。`, "ai");
          done();
        }, () => done());
      } else {
        showModal("目標重整：選擇玩家",
          state.players.map((pl, i) => i === state.currentPlayer ? "" : `<button data-i="${i}">${pl.name}</button>`).join(""),
          [{ label: "取消", fn: done }]);
        setTimeout(() => {
          document.querySelectorAll("#modalBody button").forEach(btn => {
            btn.onclick = () => {
              const ti = +btn.dataset.i;
              const target = state.players[ti];
              hideModal();
              askVetoForDirected(p, target, "目標重整", () => {
                showModal("選擇自己交出的 SDG",
                  p.sdgs.map((s, i) => `<button data-i="${i}">SDG ${s.id} (${s.progress})</button>`).join(""), []);
                setTimeout(() => {
                  document.querySelectorAll("#modalBody button").forEach(b2 => {
                    b2.onclick = () => {
                      const mySi = +b2.dataset.i;
                      hideModal();
                      showModal(`選擇 ${target.name} 的 SDG`,
                        target.sdgs.map((s, i) => `<button data-i="${i}">SDG ${s.id} (${s.progress})</button>`).join(""), []);
                      setTimeout(() => {
                        document.querySelectorAll("#modalBody button").forEach(b3 => {
                          b3.onclick = () => {
                            const tSi = +b3.dataset.i;
                            const tmp = p.sdgs[mySi];
                            p.sdgs[mySi] = target.sdgs[tSi];
                            target.sdgs[tSi] = tmp;
                            log(`${p.name} 與 ${target.name} 交換了 SDG。`);
                            hideModal();
                            done();
                          };
                        });
                      }, 50);
                    };
                  });
                }, 50);
              }, () => done());
            };
          });
        }, 50);
      }
      break;

    default:
      done();
  }
}

function checkWin() {
  for (const pl of state.players) {
    if (pl.sdgs.every(s => s.progress >= 3)) {
      document.getElementById("gameScreen").classList.remove("active");
      document.getElementById("winScreen").classList.add("active");
      document.getElementById("winnerText").textContent = `${pl.name} 率先完成兩項 SDG 目標！`;
      log(`🏆 ${pl.name} 獲勝！`, "win");
      return;
    }
  }
}
</script>
