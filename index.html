<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDG 永續桌遊 | iGEM Wiki</title>
<style>
  :root {
    --wood-light: #f4f1ea;
    --wood-mid: #e8e5da;
    --wood-dark: #d5cbb8;
    --paper: #fcfbf7;
    --ink: #3d3229;
    --ink-soft: #5c4e42;
    --border: #4a3b32;
    --teal: #2a9d8f;
    --teal-dark: #1f7a6f;
    --blue: #457b9d;
    --red: #c44536;
    --gold: #c9a227;
    --muted: #8a7a6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
    background: linear-gradient(160deg, var(--wood-light) 0%, var(--wood-mid) 45%, var(--wood-dark) 100%);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.5;
  }
  .screen { display: none; padding: 18px; max-width: 1380px; margin: 0 auto; }
  .screen.active { display: block; }
  h1 {
    text-align: center;
    margin-bottom: 16px;
    font-size: clamp(1.55rem, 3.8vw, 2.1rem);
    color: var(--border);
    font-weight: 700;
  }
  h2 { margin: 12px 0 8px; color: var(--teal-dark); font-size: 1.1rem; }
  button {
    background: var(--blue);
    color: #fff;
    border: 2px solid #3a6a88;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    box-shadow: 0 3px 0 #2c5470;
    transition: 0.12s;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #2c5470; }
  button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
  button.danger { background: var(--red); border-color: #a3382c; box-shadow: 0 3px 0 #8b2e24; }
  button.danger:active { box-shadow: 0 1px 0 #8b2e24; }
  button.success { background: var(--teal); border-color: #238b7f; box-shadow: 0 3px 0 #1a6b62; color: #fff; }
  button.success:active { box-shadow: 0 1px 0 #1a6b62; }
  button.large {
    padding: 14px 26px;
    font-size: 1.05rem;
    width: 100%;
    max-width: 340px;
    margin: 8px auto;
    display: block;
  }
  input, select {
    background: var(--paper);
    border: 2px solid #c4b8a8;
    color: var(--ink);
    padding: 8px 12px;
    border-radius: 7px;
    font-size: 0.95rem;
  }
  .menu-box, .setup-box {
    background: var(--paper);
    padding: 26px;
    border-radius: 12px;
    max-width: 500px;
    margin: 0 auto;
    text-align: center;
    border: 2px solid var(--border);
    box-shadow: 0 6px 20px rgba(74, 59, 50, 0.12);
  }
  .player-setup {
    margin: 10px 0;
    display: grid;
    grid-template-columns: 70px 1fr 160px;
    gap: 8px;
    align-items: center;
    text-align: left;
  }
  .player-setup label { font-size: 0.88rem; color: var(--muted); }

  .draft-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
    gap: 10px;
    margin: 14px 0;
  }
  .sdg-pick {
    background: var(--paper);
    border: 2px solid #c4b8a8;
    border-radius: 10px;
    padding: 11px 7px;
    text-align: center;
    cursor: pointer;
    transition: 0.15s;
    user-select: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .sdg-pick:hover:not(.disabled):not(.selected) {
    border-color: var(--teal);
    transform: translateY(-2px);
  }
  .sdg-pick.disabled { opacity: 0.35; cursor: not-allowed; }
  .sdg-pick.selected {
    border-color: var(--teal);
    background: #e6f5f3;
    box-shadow: 0 0 0 2px var(--teal);
  }
  .sdg-pick.selected::after {
    content: "✓ 已選";
    display: block;
    font-size: 0.72rem;
    color: var(--teal-dark);
    margin-top: 3px;
  }
  .draft-status { text-align: center; margin: 10px 0; font-size: 1.08rem; color: var(--teal-dark); font-weight: 600; }
  .draft-selected-count { text-align: center; color: var(--muted); margin-bottom: 6px; }

  .game-layout {
    display: grid;
    grid-template-columns: 1fr 290px;
    gap: 14px;
  }
  @media (max-width: 960px) {
    .game-layout { grid-template-columns: 1fr; }
    .log-panel { max-height: 260px; }
  }
  .board {
    background: var(--paper);
    border-radius: 12px;
    padding: 14px;
    border: 2px solid var(--border);
    box-shadow: 0 6px 18px rgba(74, 59, 50, 0.1);
  }
  .players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  .player-card {
    background: #f9f7f2;
    border: 2px solid #c4b8a8;
    border-radius: 10px;
    padding: 10px;
    position: relative;
  }
  .player-card.current {
    border-color: var(--teal);
    box-shadow: 0 0 0 2px rgba(42, 157, 143, 0.3);
  }
  .player-card.sanctioned::after {
    content: "制裁中";
    position: absolute; top: 5px; right: 7px;
    background: var(--red); color: white; font-size: 0.65rem;
    padding: 2px 6px; border-radius: 5px;
  }
  .player-card.ai-tag::before {
    content: "Bot";
    position: absolute; top: 5px; left: 7px;
    background: #6b5b4f; color: white; font-size: 0.6rem;
    padding: 2px 5px; border-radius: 4px;
  }
  .player-name { font-weight: 700; font-size: 0.98rem; margin-bottom: 6px; padding-left: 24px; }
  .sdg-row { display: flex; gap: 6px; margin-bottom: 3px; align-items: center; }
  .sdg-badge {
    background: #e8e0d4;
    border: 1px solid #c4b8a8;
    border-radius: 6px;
    padding: 3px 6px;
    font-size: 0.78rem;
    min-width: 60px;
    text-align: center;
    font-weight: 600;
  }
  .sdg-badge.goal {
    background: linear-gradient(135deg, #e8c547, #c9a227);
    border-color: #a88b1a;
    color: #3d3229;
  }
  .sdg-badge.frozen { outline: 2px solid #457b9d; }
  .progress-bar {
    flex: 1;
    height: 18px;
    background: #e5dfd4;
    border-radius: 9px;
    overflow: hidden;
    position: relative;
    border: 1px solid #c4b8a8;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #2a9d8f, #40b5a6);
    transition: width 0.5s ease;
  }
  .progress-fill.negative {
    background: linear-gradient(90deg, #c44536, #e06b5e);
  }
  .progress-preview {
    position: absolute; top: 0; bottom: 0;
    background: repeating-linear-gradient(90deg, rgba(42,157,143,0.35), rgba(42,157,143,0.35) 4px, rgba(42,157,143,0.12) 4px, rgba(42,157,143,0.12) 8px);
    border: 2px dashed #2a9d8f;
    border-radius: 9px;
    pointer-events: none;
  }
  .progress-preview.negative {
    background: repeating-linear-gradient(90deg, rgba(196,69,54,0.4), rgba(196,69,54,0.4) 4px, rgba(196,69,54,0.15) 4px, rgba(196,69,54,0.15) 8px);
    border-color: #c44536;
  }
  .progress-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 700; z-index: 2;
  }
  .progress-labels {
    display: flex; justify-content: space-between;
    font-size: 0.58rem; color: var(--muted); margin-top: 1px; padding: 0 2px;
  }

  .hand-area {
    background: #f5f2eb;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
    border: 1px solid #d5cbb8;
  }
  .hand-cards { display: flex; flex-wrap: wrap; gap: 10px; min-height: 115px; }
  .card {
    background: var(--paper);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 0;
    width: 142px;
    font-size: 0.74rem;
    cursor: pointer;
    transition: 0.18s ease;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(74, 59, 50, 0.12);
  }
  .card:hover {
    transform: translateY(-8px) scale(1.04);
    box-shadow: 0 10px 22px rgba(74, 59, 50, 0.18);
    border-color: var(--gold);
  }
  .card.selected {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px var(--gold), 0 8px 18px rgba(201, 162, 39, 0.2);
    transform: translateY(-6px) scale(1.03);
  }
  .card.disabled-card { opacity: 0.4; cursor: not-allowed; transform: none !important; }
  .card-header {
    padding: 4px 8px;
    font-size: 0.65rem;
    font-weight: 700;
  }
  .card.event .card-header { background: #e8a54b; color: #3d3229; }
  .card.special .card-header { background: #7b6b9e; color: #fff; }
  .card-body { padding: 7px; }
  .card-name { font-weight: 700; margin-bottom: 3px; font-size: 0.8rem; }
  .card-effect { color: var(--muted); font-size: 0.68rem; }
  .card-fwd { color: #1f7a6f; }
  .card-bwd { color: #a3382c; }

  .deck-info { display: flex; gap: 14px; margin: 10px 0; font-size: 0.88rem; color: var(--muted); }
  .phase-bar {
    background: #ebe6dc;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    border: 1px solid #d5cbb8;
  }
  .phase-label { font-weight: 700; color: var(--teal-dark); }
  .ai-thinking { color: #6b5b4f; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  .log-panel {
    background: var(--paper);
    border-radius: 12px;
    padding: 12px;
    height: calc(100vh - 40px);
    max-height: 840px;
    display: flex;
    flex-direction: column;
    border: 2px solid var(--border);
    box-shadow: 0 6px 18px rgba(74, 59, 50, 0.1);
  }
  .log-content {
    flex: 1;
    overflow-y: auto;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }
  .log-entry { padding: 4px 0; border-bottom: 1px solid #ebe6dc; }
  .log-entry.sys { color: var(--blue); }
  .log-entry.win { color: var(--teal-dark); font-weight: 700; }
  .log-entry.ai { color: #6b5b4f; }
  .log-entry.up { color: #1f7a6f; }
  .log-entry.down { color: #a3382c; }
  .log-entry.special { color: #8b6914; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(61, 50, 41, 0.45);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--paper);
    border-radius: 12px;
    padding: 22px;
    max-width: 440px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
    border: 2px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  .modal h3 { margin-bottom: 12px; color: var(--teal-dark); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }

  .win-screen { text-align: center; padding: 48px 20px; }
  .win-screen h1 { color: var(--gold); }
  .confirm-bar { margin-top: 10px; display: flex; gap: 10px; justify-content: center; }

  #card-play-modal {
    position: fixed; inset: 0;
    background: rgba(61, 50, 41, 0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #card-play-modal.show { opacity: 1; pointer-events: auto; }
  #card-play-modal.fade-out { opacity: 0; }
  .card-announce-box {
    background: var(--paper);
    border: 3px solid var(--border);
    border-radius: 14px;
    padding: 28px 36px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 12px 32px rgba(74, 59, 50, 0.2);
    transform: scale(0.92);
    transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  #card-play-modal.show .card-announce-box { transform: scale(1); }
  .card-announce-player { font-size: 1rem; color: var(--blue); margin-bottom: 4px; font-weight: 600; }
  .card-announce-name { font-size: 1.55rem; font-weight: 800; color: var(--border); margin-bottom: 8px; }
  .card-announce-target { font-size: 0.92rem; color: var(--gold); margin-bottom: 8px; font-weight: 600; display: none; }
  .card-announce-desc { font-size: 0.88rem; color: var(--ink-soft); margin-bottom: 14px; }
  .card-announce-effects { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
  .effect-tag {
    background: #f0ebe3;
    border: 1.5px solid #c4b8a8;
    border-radius: 16px;
    padding: 4px 11px;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .effect-tag.up { color: #1f7a6f; border-color: #2a9d8f; }
  .effect-tag.down { color: #a3382c; border-color: #c44536; }
  .effect-tag.special { color: #6b5b4f; border-color: #8a7a6a; }
</style>
</head>
<body>

<div id="card-play-modal">
  <div class="card-announce-box">
    <div class="card-announce-player" id="announcePlayer"></div>
    <div class="card-announce-name" id="announceCardName"></div>
    <div class="card-announce-target" id="announceTarget"></div>
    <div class="card-announce-desc" id="announceDesc"></div>
    <div class="card-announce-effects" id="announceEffects"></div>
  </div>
</div>

<div id="mainMenu" class="screen active">
  <h1>🌍 SDG 永續桌遊</h1>
  <div class="menu-box">
    <p style="color:var(--muted);margin-bottom:16px;">選擇遊戲模式</p>
    <button class="large success" id="btnPVC">單人 / 機器人模式 (PVC)</button>
    <button class="large" id="btnPVP">多人對戰模式 (PVP)</button>
  </div>
</div>

<div id="pvpMenu" class="screen">
  <h1>多人對戰</h1>
  <div class="menu-box">
    <button class="large success" id="btnLocal">同一裝置遊玩 (Local)</button>
    <button class="large" id="btnOnline">跨裝置線上連線 (Online)</button>
    <button class="large danger" id="btnBackMain" style="margin-top:16px;">返回主選單</button>
  </div>
</div>

<div id="setupScreen" class="screen">
  <h1>遊戲設定</h1>
  <div class="setup-box">
    <h2>玩家人數</h2>
    <select id="playerCount">
      <option value="3">3 人</option>
      <option value="4" selected>4 人</option>
      <option value="5">5 人</option>
      <option value="6">6 人</option>
    </select>
    <div id="nameInputs" style="margin-top:14px;"></div>
    <button id="startBtn" class="success" style="width:100%;margin-top:16px;padding:12px;font-size:1.05rem;">進入 SDG 挑選</button>
    <button class="danger" id="btnBackFromSetup" style="width:100%;margin-top:8px;">返回</button>
  </div>
</div>

<div id="draftScreen" class="screen">
  <h1>🎯 SDG 目標挑選</h1>
  <div class="draft-status" id="draftStatus">輪到 玩家1 挑選 2 張 SDG</div>
  <div class="draft-selected-count" id="draftCount">已選 0 / 2</div>
  <div class="draft-grid" id="draftGrid"></div>
  <div style="text-align:center;margin-top:12px;">
    <button id="btnConfirmDraft" class="success" disabled>確認選擇 SDG</button>
  </div>
  <div id="draftPicks" style="margin-top:14px;text-align:center;color:var(--muted);"></div>
</div>

<div id="gameScreen" class="screen">
  <div class="game-layout">
    <div class="board">
      <div class="phase-bar">
        <div>
          <span class="phase-label" id="phaseLabel">行動階段</span>
          <span id="turnInfo" style="margin-left:10px;"></span>
        </div>
        <div id="actionButtons">
          <button id="btnDiscardMode">棄牌模式</button>
          <button id="btnPlayMode" class="success">打出卡牌</button>
          <button id="btnCancelAction" style="display:none;">取消選擇</button>
        </div>
      </div>
      <div class="players-grid" id="playersGrid"></div>
      <div class="deck-info">
        <span>抽牌堆：<strong id="deckCount">0</strong></span>
        <span>棄牌堆：<strong id="discardCount">0</strong></span>
      </div>
      <div class="hand-area">
        <h2>目前玩家手牌 <span id="handCount"></span></h2>
        <div class="hand-cards" id="handCards"></div>
        <div class="confirm-bar" id="confirmBar" style="display:none;">
          <button id="btnConfirmAction" class="success">確認執行行動</button>
        </div>
      </div>
    </div>
    <div class="log-panel">
      <h2>遊戲歷程</h2>
      <div class="log-content" id="logContent"></div>
    </div>
  </div>
</div>

<div id="winScreen" class="screen">
  <div class="win-screen">
    <h1>🏆 勝利！</h1>
    <p id="winnerText" style="font-size:1.3rem;margin:16px 0;"></p>
    <button onclick="location.reload()" class="success">再玩一次</button>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>

  {name:"墨西哥灣漏油事故",forward:[],backward:[6,14],desc:"鑽油平台爆炸沉沒，釀史上最嚴重漏油。"},

  {name:"裹小腳",forward:[],backward:[5,16],desc:"以纏足限制女性足部發育。"},

  {name:"大規模停電",forward:[],backward:[7],desc:"電力系統故障，造成大範圍供電中斷。"},

  {name:"幽靈漁網",forward:[5,10,16],backward:[12,14],desc:"廢棄漁網持續捕殺海洋生物。"},

function trackTimeout(fn, ms) {
  if (state.isGameOver) return null;
  var id = setTimeout(function() {
    state.timers = state.timers.filter(function(t) { return t !== id; });
    if (!state.isGameOver) fn();
  }, ms);
  state.timers.push(id);
  return id;
}

function clearAllTimers() {
  state.timers.forEach(function(id) { clearTimeout(id); });
  state.timers = [];
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i];
    arr[i] = arr[j];
    arr[j] = tmp;
  }
  return arr;
}

function log(msg, type) {
  type = type || "";
  var el = document.getElementById("logContent");
  if (!el) return;
  var d = document.createElement("div");
  d.className = "log-entry " + type;
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function showModal(title, body, actions) {
  if (state.isGameOver) return;
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = body;
  var act = document.getElementById("modalActions");
  act.innerHTML = "";
  (actions || []).forEach(function(a) {
    var b = document.createElement("button");
    b.textContent = a.label;
    if (a.class) b.className = a.class;
    b.onclick = function() {
      hideModal();
      a.fn();
    };
    act.appendChild(b);
  });
  document.getElementById("modal").classList.add("show");
}

function hideModal() {
  document.getElementById("modal").classList.remove("show");
}

function getCurrentPlayer() {
  return state.players[state.currentPlayer];
}

function delay(ms) {
  return new Promise(function(resolve) {
    trackTimeout(resolve, ms);
  });
}

function randChoice(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(function(s) {
    s.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");
}

function showCardAnnouncement(playerName, card, options) {
  options = options || {};
  return new Promise(function(resolve) {
    if (state.isGameOver) {
      resolve();
      return;
    }
    state.inputLocked = true;
    var modal = document.getElementById("card-play-modal");
    document.getElementById("announcePlayer").textContent = playerName + " 打出了";
    document.getElementById("announceCardName").textContent = card.name;

    var targetEl = document.getElementById("announceTarget");
    if (options.targetName) {
      targetEl.style.display = "block";
      targetEl.textContent = "➤ 目標：" + options.targetName;
    } else {
      targetEl.style.display = "none";
      targetEl.textContent = "";
    }

    document.getElementById("announceDesc").textContent = card.desc || "";

    var effectsEl = document.getElementById("announceEffects");
    effectsEl.innerHTML = "";

    var affected = options.affectedSDGs || [];
    if (affected.length > 0) {
      affected.forEach(function(a) {
        var tag = document.createElement("span");
        tag.className = "effect-tag " + (a.delta > 0 ? "up" : "down");
        tag.textContent = "SDG " + a.id + (a.delta > 0 ? " 📈 +" : " 📉 ") + a.delta;
        effectsEl.appendChild(tag);
      });
    } else if (card.kind === "event") {
      (card.forward || []).forEach(function(id) {
        var tag = document.createElement("span");
        tag.className = "effect-tag up";
        tag.textContent = "SDG " + id + " 📈 +1";
        effectsEl.appendChild(tag);
      });
      (card.backward || []).forEach(function(id) {
        var tag = document.createElement("span");
        tag.className = "effect-tag down";
        tag.textContent = "SDG " + id + " 📉 -1";
        effectsEl.appendChild(tag);
      });
    } else {
      var tag = document.createElement("span");
      tag.className = "effect-tag special";
      tag.textContent = "特殊效果";
      effectsEl.appendChild(tag);
    }

    modal.classList.remove("fade-out");
    modal.classList.add("show");

    trackTimeout(function() {
      modal.classList.add("fade-out");
      trackTimeout(function() {
        modal.classList.remove("show", "fade-out");
        state.inputLocked = false;
        resolve();
      }, 320);
    }, 3000);
  });
}

function startLocalDraft() {
  var count = parseInt(document.getElementById("playerCount").value, 10);
  var names = [];
  var types = [];
  for (var i = 0; i < count; i++) {
    names.push(document.getElementById("pname" + i).value.trim() || ("玩家" + (i + 1)));
    types.push(document.getElementById("ptype" + i).value);
  }
  state.players = names.map(function(n, i) {
    var t = types[i];
    var isAI = t !== "human";
    return {
      name: n,
      isAI: isAI,
      difficulty: isAI ? t : "basic",
      sdgs: [],
      hand: [],
      sanctioned: false,
      capacityNext: false
    };
  });
  state.isGameOver = false;
  clearAllTimers();
  state.draftAvailable = [];
  for (var k = 1; k <= 17; k++) state.draftAvailable.push(k);
  shuffle(state.draftAvailable);
  state.draftCurrentPlayer = 0;
  state.draftSelected = [];
  showScreen("draftScreen");
  renderDraft();
}

function renderDraft() {
  if (state.isGameOver) return;
  var p = state.players[state.draftCurrentPlayer];
  document.getElementById("draftStatus").textContent =
    "輪到 " + p.name + (p.isAI ? " (Bot)" : "") + " 挑選 2 張 SDG";
  document.getElementById("draftCount").textContent = "已選 " + state.draftSelected.length + " / 2";

  var grid = document.getElementById("draftGrid");
  grid.innerHTML = "";
  for (var id = 1; id <= 17; id++) {
    var avail = state.draftAvailable.indexOf(id) !== -1;
    var sel = state.draftSelected.indexOf(id) !== -1;
    var div = document.createElement("div");
    div.className = "sdg-pick" + (!avail ? " disabled" : "") + (sel ? " selected" : "");
    div.innerHTML = "<strong>SDG " + id + "</strong><br><span style=\"font-size:0.74rem;color:#8a7a6a;\">" + (SDG_NAMES[id] || "") + "</span>";
    if (avail && !p.isAI) {
      (function(sid) {
        div.onclick = function() { toggleDraftSelect(sid); };
      })(id);
    }
    grid.appendChild(div);
  }

  document.getElementById("draftPicks").textContent = state.players.map(function(pl) {
    var s = pl.sdgs.map(function(x) { return "SDG " + x.id; }).join(", ") || "尚未選擇";
    return pl.name + ": " + s;
  }).join(" ｜ ");

  document.getElementById("btnConfirmDraft").disabled = state.draftSelected.length !== 2 || p.isAI;

  if (p.isAI) {
    trackTimeout(aiDraftPick, 550 + Math.random() * 350);
  }
}

function toggleDraftSelect(id) {
  var idx = state.draftSelected.indexOf(id);
  if (idx >= 0) {
    state.draftSelected.splice(idx, 1);
  } else if (state.draftSelected.length < 2) {
    state.draftSelected.push(id);
  }
  renderDraft();
}

document.getElementById("btnConfirmDraft").onclick = function() {
  if (state.draftSelected.length !== 2) return;
  confirmDraftPick(state.draftSelected.slice());
};

function confirmDraftPick(ids) {
  var p = state.players[state.draftCurrentPlayer];
  ids.forEach(function(id) {
    p.sdgs.push({ id: id, progress: 0, frozen: false, immune: false });
    state.draftAvailable = state.draftAvailable.filter(function(x) { return x !== id; });
  });
  state.draftSelected = [];
  state.draftCurrentPlayer++;
  if (state.draftCurrentPlayer >= state.players.length) {
    startGameAfterDraft();
    return;
  }
  renderDraft();
}

function aiDraftPick() {
  if (state.isGameOver) return;
  var p = state.players[state.draftCurrentPlayer];
  if (!p.isAI || state.draftAvailable.length < 2) return;
  var picks;
  if (p.difficulty === "easy") {
    picks = shuffle(state.draftAvailable.slice()).slice(0, 2);
  } else {
    picks = state.draftAvailable.slice().sort(function(a, b) {
      return Math.abs(a - 8.5) - Math.abs(b - 8.5);
    }).slice(0, 2);
  }
  state.draftSelected = picks;
  renderDraft();
  trackTimeout(function() {
    confirmDraftPick(picks);
  }, 400);
}

function startGameAfterDraft() {
  state.unusedSDGs = state.draftAvailable.slice();
  shuffle(state.unusedSDGs);
  state.deck = [];
  eventCards.forEach(function(c) {
    state.deck.push({
      name: c.name, forward: c.forward.slice(), backward: c.backward.slice(),
      desc: c.desc, kind: "event", id: Math.random().toString(36).slice(2)
    });
  });
  specialCards.forEach(function(c) {
    for (var i = 0; i < 2; i++) {
      state.deck.push({
        name: c.name, type: c.type, desc: c.desc,
        kind: "special", id: Math.random().toString(36).slice(2) + i
      });
    }
  });
  shuffle(state.deck);
  state.discard = [];
  state.players.forEach(function(p) {
    for (var i = 0; i < 5; i++) {
      if (state.deck.length === 0) reshuffle();
      p.hand.push(state.deck.pop());
    }
  });
  state.currentPlayer = 0;
  state.phase = "action";
  state.modeAction = null;
  state.selectedCards = [];
  state.maxPlay = 2;
  state.capacityActive = false;
  state.isAIThinking = false;
  state.previewDeltas = {};
  state.isGameOver = false;
  showScreen("gameScreen");
  log("SDG 挑選完成，遊戲開始！", "sys");
  log("請 " + getCurrentPlayer().name + " 開始行動。", "sys");
  updateUI();
  maybeTriggerAI();
}

function reshuffle() {
  if (state.discard.length === 0) return;
  state.deck = state.discard.splice(0);
  shuffle(state.deck);
  log("抽牌堆用盡，已重新洗牌。", "sys");
}

function computePreview() {
  state.previewDeltas = {};
  var p = getCurrentPlayer();
  if (state.modeAction !== "play" || state.selectedCards.length === 0 || p.isAI) return;
  state.selectedCards.forEach(function(idx) {
    var card = p.hand[idx];
    if (!card || card.kind !== "event") return;
    (card.forward || []).forEach(function(id) {
      state.players.forEach(function(pl, pi) {
        pl.sdgs.forEach(function(s, si) {
          if (s.id === id && s.progress < 3 && !s.frozen) {
            if (!state.previewDeltas[pi]) state.previewDeltas[pi] = {};
            state.previewDeltas[pi][si] = (state.previewDeltas[pi][si] || 0) + 1;
          }
        });
      });
    });
    (card.backward || []).forEach(function(id) {
      state.players.forEach(function(pl, pi) {
        pl.sdgs.forEach(function(s, si) {
          if (s.id === id && s.progress < 3 && !s.frozen && !s.immune) {
            if (!state.previewDeltas[pi]) state.previewDeltas[pi] = {};
            state.previewDeltas[pi][si] = (state.previewDeltas[pi][si] || 0) - 1;
          }
        });
      });
    });
  });
}

function updateUI() {
  if (state.isGameOver) return;
  var p = getCurrentPlayer();
  if (!p) return;

  document.getElementById("turnInfo").textContent = "目前回合：" + p.name + (p.isAI ? " (Bot)" : "");
  document.getElementById("deckCount").textContent = state.deck.length;
  document.getElementById("discardCount").textContent = state.discard.length;
  document.getElementById("handCount").textContent = "(" + p.hand.length + "/5)";

  var phaseText = "行動階段";
  if (state.isAIThinking) phaseText = "Bot 思考中...";
  else if (state.modeAction === "discard") phaseText = "棄牌模式：選牌後確認";
  else if (state.modeAction === "play") phaseText = "打牌模式（最多 " + state.maxPlay + " 張）";
  document.getElementById("phaseLabel").textContent = phaseText;
  document.getElementById("phaseLabel").className = "phase-label" + (state.isAIThinking ? " ai-thinking" : "");

  var humanTurn = !p.isAI && state.phase === "action" && !state.isAIThinking && !state.inputLocked && !state.isGameOver;
  var btnD = document.getElementById("btnDiscardMode");
  var btnP = document.getElementById("btnPlayMode");
  var btnC = document.getElementById("btnCancelAction");
  var conf = document.getElementById("confirmBar");

  if (humanTurn && !state.modeAction) {
    btnD.style.display = "";
    btnP.style.display = "";
    btnC.style.display = "none";
    conf.style.display = "none";
  } else if (humanTurn && (state.modeAction === "discard" || state.modeAction === "play")) {
    btnD.style.display = "none";
    btnP.style.display = "none";
    btnC.style.display = "";
    conf.style.display = state.selectedCards.length > 0 ? "flex" : "none";
  } else {
    btnD.style.display = "none";
    btnP.style.display = "none";
    btnC.style.display = "none";
    conf.style.display = "none";
  }

  computePreview();

  var grid = document.getElementById("playersGrid");
  grid.innerHTML = "";
  state.players.forEach(function(pl, idx) {
    var div = document.createElement("div");
    div.className = "player-card" +
      (idx === state.currentPlayer ? " current" : "") +
      (pl.sanctioned ? " sanctioned" : "") +
      (pl.isAI ? " ai-tag" : "");
    var html = '<div class="player-name">' + pl.name +
      (idx === state.currentPlayer ? " ▶" : "") +
      (pl.isAI ? " [" + pl.difficulty + "]" : "") + "</div>";
    pl.sdgs.forEach(function(s, si) {
      var cur = s.progress;
      var delta = (state.previewDeltas[idx] && state.previewDeltas[idx][si]) || 0;
      var preview = clamp(cur + delta, -2, 3);
      var pct = ((cur + 2) / 5) * 100;
      var previewPct = ((preview + 2) / 5) * 100;
      html += '<div class="sdg-row">' +
        '<div class="sdg-badge ' + (cur >= 3 ? "goal" : "") + (s.frozen ? " frozen" : "") + '">SDG ' + s.id + '</div>' +
        '<div class="progress-bar">' +
        '<div class="progress-fill ' + (cur < 0 ? "negative" : "") + '" style="width:' + pct + '%"></div>' +
        (delta !== 0 ? '<div class="progress-preview ' + (delta < 0 ? "negative" : "") + '" style="left:0;width:' + Math.max(pct, previewPct) + '%;"></div>' : "") +
        '<div class="progress-text">' + (cur >= 3 ? "GOAL" : cur) +
        (delta ? " →" + preview : "") +
        (s.frozen ? " ❄" : "") + (s.immune ? " 🛡" : "") + '</div></div></div>' +
        '<div class="progress-labels"><span>-2</span><span>-1</span><span>0</span><span>1</span><span>2</span><span>GOAL</span></div>' +
        '<div style="font-size:0.66rem;color:#8a7a6a;margin-bottom:2px;">' + (SDG_NAMES[s.id] || "") + '</div>';
    });
    div.innerHTML = html;
    grid.appendChild(div);
  });

  var handEl = document.getElementById("handCards");
  handEl.innerHTML = "";
  p.hand.forEach(function(card, idx) {
    var cannot = state.modeAction === "play" && card.type === "veto";
    var div = document.createElement("div");
    div.className = "card " + (card.kind === "event" ? "event" : "special") +
      (state.selectedCards.indexOf(idx) !== -1 ? " selected" : "") +
      (cannot ? " disabled-card" : "");
    var effect = "";
    if (card.kind === "event") {
      effect = '<div class="card-fwd">' + (card.forward.length ? "前進：" + card.forward.join(",") : "") + '</div>' +
               '<div class="card-bwd">' + (card.backward.length ? "後退：" + card.backward.join(",") : "") + '</div>';
    } else {
      effect = '<div class="card-effect">' + (card.desc || "") + '</div>';
    }
    div.innerHTML =
      '<div class="card-header">' + (card.kind === "event" ? "歷史事件" : "特殊功能") + '</div>' +
      '<div class="card-body"><div class="card-name">' + card.name + '</div>' + effect + '</div>';
    if (!p.isAI && !cannot && !state.inputLocked && !state.isGameOver) {
      (function(i) {
        div.onclick = function() { onCardClick(i); };
      })(idx);
    }
    handEl.appendChild(div);
  });
}

document.getElementById("btnDiscardMode").onclick = function() {
  if (state.inputLocked || state.isGameOver) return;
  state.modeAction = "discard";
  state.selectedCards = [];
  updateUI();
};
document.getElementById("btnPlayMode").onclick = function() {
  if (state.inputLocked || state.isGameOver) return;
  state.modeAction = "play";
  state.maxPlay = getCurrentPlayer().sanctioned ? 1 : 2;
  state.selectedCards = [];
  updateUI();
};
document.getElementById("btnCancelAction").onclick = function() {
  state.modeAction = null;
  state.selectedCards = [];
  state.previewDeltas = {};
  updateUI();
};
document.getElementById("btnConfirmAction").onclick = function() {
  if (state.inputLocked || state.isGameOver || state.selectedCards.length === 0) return;
  if (state.modeAction === "discard") executeDiscard();
  else executePlay();
};

function onCardClick(idx) {
  if (state.inputLocked || state.isGameOver || state.phase !== "action" || !state.modeAction || getCurrentPlayer().isAI) return;
  var card = getCurrentPlayer().hand[idx];
  if (state.modeAction === "play" && card.type === "veto") return;
  if (state.modeAction === "discard") {
    var pos = state.selectedCards.indexOf(idx);
    if (pos >= 0) state.selectedCards.splice(pos, 1);
    else state.selectedCards.push(idx);
  } else {
    var pos2 = state.selectedCards.indexOf(idx);
    if (pos2 >= 0) {
      state.selectedCards.splice(pos2, 1);
    } else {
      if (state.selectedCards.length >= state.maxPlay) state.selectedCards.shift();
      state.selectedCards.push(idx);
    }
  }
  updateUI();
}

function executeDiscard() {
  var p = getCurrentPlayer();
  var sorted = state.selectedCards.slice().sort(function(a, b) { return b - a; });
  sorted.forEach(function(i) {
    var c = p.hand.splice(i, 1)[0];
    state.discard.push(c);
    log(p.name + " 棄掉「" + c.name + "」");
  });
  state.selectedCards = [];
  state.modeAction = null;
  endActionPhase();
}

async function executePlay() {
  var p = getCurrentPlayer();
  var sorted = state.selectedCards.slice().sort(function(a, b) { return b - a; });
  var cards = [];
  sorted.forEach(function(i) {
    cards.unshift(p.hand.splice(i, 1)[0]);
  });
  cards.forEach(function(c) {
    state.discard.push(c);
  });
  state.selectedCards = [];
  state.modeAction = null;

  for (var ci = 0; ci < cards.length; ci++) {
    if (state.isGameOver) break;
    var card = cards[ci];
    var affected = [];
    if (card.kind === "event") {
      (card.forward || []).forEach(function(id) { affected.push({ id: id, delta: 1 }); });
      (card.backward || []).forEach(function(id) { affected.push({ id: id, delta: -1 }); });
    }
    await showCardAnnouncement(p.name, card, { affectedSDGs: affected });
    log(p.name + " 打出「" + card.name + "」", card.kind === "event" ? "up" : "special");
    updateUI();
    await new Promise(function(r) { resolveCard(card, false, r); });
    await delay(120);
  }
  if (!state.isGameOver) endActionPhase();
}

function endActionPhase() {
  if (state.isGameOver) return;
  state.modeAction = null;
  state.selectedCards = [];
  getCurrentPlayer().sdgs.forEach(function(s) { s.immune = false; });
  state.phase = "draw";
  doDrawPhase();
}

function doDrawPhase() {
  if (state.isGameOver) return;
  var p = getCurrentPlayer();
  var need = 5 - p.hand.length;
  if (p.capacityNext) {
    need += 1;
    p.capacityNext = false;
    state.capacityActive = true;
  }
  var drawn = [];
  for (var i = 0; i < need; i++) {
    if (state.deck.length === 0) reshuffle();
    if (state.deck.length === 0) break;
    drawn.push(state.deck.pop());
  }
  if (state.capacityActive && drawn.length > 0) {
    state.capacityActive = false;
    if (p.isAI) {
      var ri = Math.floor(Math.random() * drawn.length);
      state.discard.push(drawn.splice(ri, 1)[0]);
      p.hand = p.hand.concat(drawn);
      finishTurn();
    } else {
      var body = drawn.map(function(c, i) {
        return '<button data-i="' + i + '">' + c.name + '</button>';
      }).join("");
      showModal("能力建構：選擇棄置", body, []);
      setTimeout(function() {
        document.querySelectorAll("#modalBody button").forEach(function(btn) {
          btn.onclick = function() {
            var i = parseInt(btn.getAttribute("data-i"), 10);
            state.discard.push(drawn.splice(i, 1)[0]);
            p.hand = p.hand.concat(drawn);
            hideModal();
            finishTurn();
          };
        });
      }, 30);
    }
  } else {
    p.hand = p.hand.concat(drawn);
    if (drawn.length > 0) log(p.name + " 補了 " + drawn.length + " 張牌");
    finishTurn();
  }
}

function finishTurn() {
  if (state.isGameOver) return;
  var next = (state.currentPlayer + 1) % state.players.length;
  getCurrentPlayer().sanctioned = false;
  state.players[next].sdgs.forEach(function(s) { s.frozen = false; });
  state.currentPlayer = next;
  state.phase = "action";
  state.modeAction = null;
  log("── 輪到 " + getCurrentPlayer().name + " ──", "sys");
  checkWin();
  if (!state.isGameOver) {
    updateUI();
    maybeTriggerAI();
  }
}

async function maybeTriggerAI() {
  if (state.isGameOver) return;
  var p = getCurrentPlayer();
  if (!p || !p.isAI || state.phase !== "action") return;
  state.isAIThinking = true;
  updateUI();
  await delay(650 + Math.random() * 350);
  if (state.isGameOver) return;

  var playable = [];
  p.hand.forEach(function(c, i) {
    if (c.type !== "veto") playable.push(i);
  });

  if (playable.length > 0 && Math.random() > 0.28) {
    var n = Math.min(playable.length, p.sanctioned ? 1 : 2);
    shuffle(playable);
    var idxs = playable.slice(0, n);
    var cards = [];
    idxs.sort(function(a, b) { return b - a; }).forEach(function(i) {
      cards.unshift(p.hand.splice(i, 1)[0]);
    });
    cards.forEach(function(c) { state.discard.push(c); });

    for (var ci = 0; ci < cards.length; ci++) {
      if (state.isGameOver) break;
      var card = cards[ci];
      var affected = [];
      if (card.kind === "event") {
        (card.forward || []).forEach(function(id) { affected.push({ id: id, delta: 1 }); });
        (card.backward || []).forEach(function(id) { affected.push({ id: id, delta: -1 }); });
      }
      await showCardAnnouncement(p.name, card, { affectedSDGs: affected });
      log(p.name + " 打出「" + card.name + "」", "ai");
      await new Promise(function(r) { resolveCard(card, true, r); });
    }
  } else {
    var n2 = Math.min(2, p.hand.length);
    for (var j = 0; j < n2; j++) {
      var c = p.hand.pop();
      state.discard.push(c);
      log(p.name + " 棄掉「" + c.name + "」", "ai");
    }
  }
  state.isAIThinking = false;
  if (!state.isGameOver) endActionPhase();
}

function isValidNegativeTarget(s) {
  return s.progress < 3 && !s.immune && !s.frozen;
}

function resolveCard(card, isAI, done) {
  if (state.isGameOver) {
    done();
    return;
  }
  if (card.kind === "event") resolveEvent(card, isAI, done);
  else resolveSpecial(card, isAI, done);
}

function resolveEvent(card, isAI, done) {
  (card.forward || []).forEach(function(id) {
    state.players.forEach(function(pl) {
      pl.sdgs.forEach(function(s) {
        if (s.id === id && s.progress < 3 && !s.frozen) {
          s.progress = clamp(s.progress + 1, -2, 3);
          log(pl.name + " 的 SDG " + id + " 前進至 " + s.progress, "up");
        }
      });
    });
  });

  if (!card.backward || card.backward.length === 0) {
    done();
    return;
  }

  var targets = [];
  state.players.forEach(function(pl) {
    pl.sdgs.forEach(function(s) {
      if (card.backward.indexOf(s.id) !== -1 && isValidNegativeTarget(s)) {
        targets.push({ pl: pl, s: s });
      }
    });
  });

  if (targets.length === 0) {
    log("後退無有效目標");
    done();
    return;
  }

  var i = 0;
  function next() {
    if (state.isGameOver || i >= targets.length) {
      done();
      return;
    }
    var t = targets[i++];
    var vIdx = -1;
    for (var vi = 0; vi < t.pl.hand.length; vi++) {
      if (t.pl.hand[vi].type === "veto") {
        vIdx = vi;
        break;
      }
    }

    if (vIdx >= 0 && !t.pl.isAI) {
      showModal("否決權", "<p>" + t.pl.name + " 的 SDG " + t.s.id + " 即將後退，是否使用否決權？</p>", [
        {
          label: "使用",
          class: "success",
          fn: function() {
            t.pl.hand.splice(vIdx, 1);
            state.discard.push({ type: "veto" });
            log(t.pl.name + " 使用否決權", "special");
            next();
          }
        },
        {
          label: "不使用",
          class: "danger",
          fn: function() {
            t.s.progress = clamp(t.s.progress - 1, -2, 3);
            log(t.pl.name + " 的 SDG " + t.s.id + " 後退至 " + t.s.progress, "down");
            next();
          }
        }
      ]);
    } else {
      if (vIdx >= 0 && t.pl.isAI && t.pl.difficulty === "advance") {
        t.pl.hand.splice(vIdx, 1);
        log(t.pl.name + " (Bot) 使用否決權", "ai");
      } else {
        t.s.progress = clamp(t.s.progress - 1, -2, 3);
        log(t.pl.name + " 的 SDG " + t.s.id + " 後退至 " + t.s.progress, "down");
      }
      next();
    }
  }
  next();
}

function resolveSpecial(card, isAI, done) {
  var p = getCurrentPlayer();
  if (card.type === "capacity") {
    p.capacityNext = true;
    log(p.name + " 獲得【能力建構】", "special");
    done();
  } else if (card.type === "immunity") {
    if (isAI) {
      p.sdgs[0].immune = true;
      log(p.name + " (Bot) 獲得豁免", "ai");
      done();
    } else {
      var body = p.sdgs.map(function(s, i) {
        return '<button data-i="' + i + '">SDG ' + s.id + '</button>';
      }).join("");
      showModal("政策豁免", body, []);
      setTimeout(function() {
        document.querySelectorAll("#modalBody button").forEach(function(btn) {
          btn.onclick = function() {
            var i = parseInt(btn.getAttribute("data-i"), 10);
            p.sdgs[i].immune = true;
            log(p.name + " 的 SDG " + p.sdgs[i].id + " 獲得豁免", "special");
            hideModal();
            done();
          };
        });
      }, 30);
    }
  } else if (card.type === "freeze") {
    var best = null;
    state.players.forEach(function(pl) {
      if (pl === p) return;
      pl.sdgs.forEach(function(s) {
        if (isValidNegativeTarget(s) && (!best || s.progress > best.progress)) {
          best = { pl: pl, s: s };
        }
      });
    });
    if (best) {
      best.s.frozen = true;
      log("[" + p.name + "] 對 [" + best.pl.name + "] 使用了【凍結計畫】！", "special");
    }
    done();
  } else if (card.type === "sanction") {
    var bestP = null;
    var max = -99;
    state.players.forEach(function(pl) {
      if (pl === p) return;
      var t = pl.sdgs.reduce(function(a, s) { return a + s.progress; }, 0);
      if (t > max) {
        max = t;
        bestP = pl;
      }
    });
    if (bestP) {
      bestP.sanctioned = true;
      log("[" + p.name + "] 對 [" + bestP.name + "] 使用了【國際制裁】！", "special");
    }
    done();
  } else if (card.type === "tradeHand") {
    var opps = state.players.filter(function(pl) {
      return pl !== p && pl.hand.length > 0;
    });
    if (opps.length > 0 && p.hand.length > 0) {
      var target = randChoice(opps);
      var myC = p.hand.pop();
      var tC = target.hand.pop();
      p.hand.push(tC);
      target.hand.push(myC);
      log("[" + p.name + "] 與 [" + target.name + "] 交換了手牌！", "special");
    }
    done();
  } else if (card.type === "swapSDG") {
    var opps2 = state.players.filter(function(pl) { return pl !== p; });
    if (opps2.length > 0) {
      var target2 = randChoice(opps2);
      var tmp = p.sdgs[0];
      p.sdgs[0] = target2.sdgs[0];
      target2.sdgs[0] = tmp;
      log("[" + p.name + "] 與 [" + target2.name + "] 交換了 SDG！", "special");
    }
    done();
  } else {
    log("「" + card.name + "」效果已觸發", "special");
    done();
  }
}

function checkWin() {
  for (var i = 0; i < state.players.length; i++) {
    var pl = state.players[i];
    var allGoal = pl.sdgs.every(function(s) { return s.progress >= 3; });
    if (allGoal) {
      state.isGameOver = true;
      clearAllTimers();
      state.isAIThinking = false;
      state.inputLocked = true;
      showScreen("winScreen");
      document.getElementById("winnerText").textContent = pl.name + " 率先完成兩項 SDG 目標！";
      log("🏆 " + pl.name + " 獲勝！遊戲結束。", "win");
      return;
    }
  }
}
</script>
