<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDG Board Game | iGEM Wiki</title>
<style>
  :root {
    --wood-light: #f4f1ea; --wood-mid: #e8e5da; --wood-dark: #d5cbb8;
    --paper: #fcfbf7; --ink: #3d3229; --ink-soft: #5c4e42; --border: #4a3b32;
    --teal: #2a9d8f; --teal-dark: #1f7a6f; --blue: #457b9d; --red: #c44536;
    --gold: #c9a227; --muted: #8a7a6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
    background: linear-gradient(160deg, var(--wood-light), var(--wood-mid), var(--wood-dark));
    background-attachment: fixed; color: var(--ink); min-height: 100vh; line-height: 1.5;
  }
  .lang-bar {
    position: fixed; top: 10px; right: 14px; z-index: 50;
    background: var(--paper); border: 2px solid var(--border); border-radius: 8px;
    padding: 6px 12px; font-size: 0.85rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .lang-bar select { border: 1px solid #c4b8a8; border-radius: 5px; padding: 3px 6px; background: #fff; }
  .screen { display: none; padding: 18px; max-width: 1380px; margin: 0 auto; }
  .screen.active { display: block; }
  h1 { text-align: center; margin-bottom: 16px; font-size: clamp(1.5rem, 3.8vw, 2.1rem); color: var(--border); }
  h2 { margin: 12px 0 8px; color: var(--teal-dark); font-size: 1.1rem; }
  button {
    background: var(--blue); color: #fff; border: 2px solid #3a6a88; padding: 10px 18px;
    border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 600;
    box-shadow: 0 3px 0 #2c5470; transition: 0.12s;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #2c5470; }
  button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
  button.danger { background: var(--red); border-color: #a3382c; box-shadow: 0 3px 0 #8b2e24; }
  button.success { background: var(--teal); border-color: #238b7f; box-shadow: 0 3px 0 #1a6b62; }
  button.large { padding: 14px 26px; font-size: 1.05rem; width: 100%; max-width: 340px; margin: 8px auto; display: block; }
  input, select { background: var(--paper); border: 2px solid #c4b8a8; color: var(--ink); padding: 8px 12px; border-radius: 7px; font-size: 0.95rem; }
  .menu-box, .setup-box {
    background: var(--paper); padding: 26px; border-radius: 12px; max-width: 500px; margin: 0 auto;
    text-align: center; border: 2px solid var(--border); box-shadow: 0 6px 20px rgba(74,59,50,0.12);
  }
  .player-setup { margin: 10px 0; display: grid; grid-template-columns: 70px 1fr 160px; gap: 8px; align-items: center; text-align: left; }
  .player-setup label { font-size: 0.88rem; color: var(--muted); }
  .draft-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; margin: 14px 0; }
  .sdg-pick {
    background: var(--paper); border: 2px solid #c4b8a8; border-radius: 10px; padding: 11px 7px;
    text-align: center; cursor: pointer; transition: 0.15s; user-select: none;
  }
  .sdg-pick:hover:not(.disabled):not(.selected) { border-color: var(--teal); transform: translateY(-2px); }
  .sdg-pick.disabled { opacity: 0.35; cursor: not-allowed; }
  .sdg-pick.selected { border-color: var(--teal); background: #e6f5f3; box-shadow: 0 0 0 2px var(--teal); }
  .sdg-pick.selected::after { content: "✓"; display: block; font-size: 0.72rem; color: var(--teal-dark); margin-top: 3px; }
  .draft-status { text-align: center; margin: 10px 0; font-size: 1.08rem; color: var(--teal-dark); font-weight: 600; }
  .draft-selected-count { text-align: center; color: var(--muted); margin-bottom: 6px; }
  .game-layout { display: grid; grid-template-columns: 1fr 290px; gap: 14px; }
  @media (max-width: 960px) { .game-layout { grid-template-columns: 1fr; } .log-panel { max-height: 260px; } }
  .board { background: var(--paper); border-radius: 12px; padding: 14px; border: 2px solid var(--border); box-shadow: 0 6px 18px rgba(74,59,50,0.1); }
  .players-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .player-card { background: #f9f7f2; border: 2px solid #c4b8a8; border-radius: 10px; padding: 10px; position: relative; }
  .player-card.current { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(42,157,143,0.3); }
  .player-card.sanctioned::after { content: attr(data-sanction); position: absolute; top: 5px; right: 7px; background: var(--red); color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 5px; }
  .player-card.ai-tag::before { content: "Bot"; position: absolute; top: 5px; left: 7px; background: #6b5b4f; color: #fff; font-size: 0.6rem; padding: 2px 5px; border-radius: 4px; }
  .player-name { font-weight: 700; font-size: 0.98rem; margin-bottom: 6px; padding-left: 24px; }
  .sdg-row { display: flex; gap: 6px; margin-bottom: 3px; align-items: center; }
  .sdg-badge { background: #e8e0d4; border: 1px solid #c4b8a8; border-radius: 6px; padding: 3px 6px; font-size: 0.78rem; min-width: 60px; text-align: center; font-weight: 600; }
  .sdg-badge.goal { background: linear-gradient(135deg, #e8c547, #c9a227); border-color: #a88b1a; }
  .sdg-badge.frozen { outline: 2px solid #457b9d; }
  .progress-bar { flex: 1; height: 18px; background: #e5dfd4; border-radius: 9px; overflow: hidden; position: relative; border: 1px solid #c4b8a8; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #2a9d8f, #40b5a6); transition: width 0.5s ease; }
  .progress-fill.negative { background: linear-gradient(90deg, #c44536, #e06b5e); }
  .progress-preview { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, rgba(42,157,143,0.35), rgba(42,157,143,0.35) 4px, rgba(42,157,143,0.12) 4px, rgba(42,157,143,0.12) 8px); border: 2px dashed #2a9d8f; border-radius: 9px; pointer-events: none; }
  .progress-preview.negative { background: repeating-linear-gradient(90deg, rgba(196,69,54,0.4), rgba(196,69,54,0.4) 4px, rgba(196,69,54,0.15) 4px, rgba(196,69,54,0.15) 8px); border-color: #c44536; }
  .progress-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; z-index: 2; }
  .progress-labels { display: flex; justify-content: space-between; font-size: 0.58rem; color: var(--muted); margin-top: 1px; padding: 0 2px; }
  .hand-area { background: #f5f2eb; border-radius: 10px; padding: 12px; margin-top: 10px; border: 1px solid #d5cbb8; }
  .hand-cards { display: flex; flex-wrap: wrap; gap: 10px; min-height: 115px; }
  .card {
    background: var(--paper); border: 2px solid var(--border); border-radius: 10px; padding: 0; width: 142px;
    font-size: 0.74rem; cursor: pointer; transition: 0.18s; overflow: hidden; box-shadow: 0 4px 10px rgba(74,59,50,0.12);
  }
  .card:hover { transform: translateY(-8px) scale(1.04); border-color: var(--gold); }
  .card.selected { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); transform: translateY(-6px); }
  .card.disabled-card { opacity: 0.4; cursor: not-allowed; transform: none !important; }
  .card-header { padding: 4px 8px; font-size: 0.65rem; font-weight: 700; }
  .card.event .card-header { background: #e8a54b; color: #3d3229; }
  .card.special .card-header { background: #7b6b9e; color: #fff; }
  .card-body { padding: 7px; }
  .card-name { font-weight: 700; margin-bottom: 3px; font-size: 0.8rem; }
  .card-effect { color: var(--muted); font-size: 0.68rem; }
  .card-fwd { color: #1f7a6f; }
  .card-bwd { color: #a3382c; }
  .deck-info { display: flex; gap: 14px; margin: 10px 0; font-size: 0.88rem; color: var(--muted); }
  .phase-bar { background: #ebe6dc; padding: 10px 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; border: 1px solid #d5cbb8; }
  .phase-label { font-weight: 700; color: var(--teal-dark); }
  .ai-thinking { color: #6b5b4f; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .log-panel { background: var(--paper); border-radius: 12px; padding: 12px; height: calc(100vh - 40px); max-height: 840px; display: flex; flex-direction: column; border: 2px solid var(--border); }
  .log-content { flex: 1; overflow-y: auto; font-size: 0.8rem; color: var(--ink-soft); }
  .log-entry { padding: 4px 0; border-bottom: 1px solid #ebe6dc; }
  .log-entry.sys { color: var(--blue); }
  .log-entry.win { color: var(--teal-dark); font-weight: 700; }
  .log-entry.ai { color: #6b5b4f; }
  .log-entry.up { color: #1f7a6f; }
  .log-entry.down { color: #a3382c; }
  .log-entry.special { color: #8b6914; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(61,50,41,0.45); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--paper); border-radius: 12px; padding: 22px; max-width: 480px; width: 92%; max-height: 85vh; overflow-y: auto; border: 2px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
  .modal h3 { margin-bottom: 12px; color: var(--teal-dark); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .modal-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; max-height: 280px; overflow-y: auto; }
  .modal-list button { font-size: 0.82rem; padding: 8px 12px; }
  .win-screen { text-align: center; padding: 48px 20px; }
  .win-screen h1 { color: var(--gold); }
  .confirm-bar { margin-top: 10px; display: flex; gap: 10px; justify-content: center; }
  #card-play-modal {
    position: fixed; inset: 0; background: rgba(61,50,41,0.4); display: flex; align-items: center; justify-content: center;
    z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  #card-play-modal.show { opacity: 1; pointer-events: auto; }
  #card-play-modal.fade-out { opacity: 0; }
  .card-announce-box {
    background: var(--paper); border: 3px solid var(--border); border-radius: 14px; padding: 28px 36px;
    max-width: 420px; width: 90%; text-align: center; box-shadow: 0 12px 32px rgba(74,59,50,0.2);
    transform: scale(0.92); transition: transform 0.35s cubic-bezier(0.34,1.4,0.64,1);
  }
  #card-play-modal.show .card-announce-box { transform: scale(1); }
  .card-announce-player { font-size: 1rem; color: var(--blue); margin-bottom: 4px; font-weight: 600; }
  .card-announce-name { font-size: 1.55rem; font-weight: 800; color: var(--border); margin-bottom: 8px; }
  .card-announce-target { font-size: 0.92rem; color: var(--gold); margin-bottom: 8px; font-weight: 600; display: none; }
  .card-announce-desc { font-size: 0.88rem; color: var(--ink-soft); margin-bottom: 14px; }
  .card-announce-effects { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
  .effect-tag { background: #f0ebe3; border: 1.5px solid #c4b8a8; border-radius: 16px; padding: 4px 11px; font-size: 0.82rem; font-weight: 600; }
  .effect-tag.up { color: #1f7a6f; border-color: #2a9d8f; }
  .effect-tag.down { color: #a3382c; border-color: #c44536; }
  .effect-tag.special { color: #6b5b4f; }
  #ai-notice {
    position: fixed; inset: 0; background: rgba(61,50,41,0.35); display: none; align-items: center; justify-content: center; z-index: 9000;
  }
  #ai-notice.show { display: flex; }
  .ai-notice-box {
    background: var(--paper); border: 3px solid var(--border); border-radius: 12px; padding: 22px 32px;
    max-width: 420px; text-align: center; font-size: 1.05rem; font-weight: 600; color: var(--ink);
    box-shadow: 0 10px 28px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>

<div class="lang-bar">
  🌐 <select id="langSelect">
    <option value="zh">繁體中文</option>
    <option value="en">English</option>
  </select>
</div>

<div id="ai-notice"><div class="ai-notice-box" id="aiNoticeText"></div></div>

<div id="card-play-modal">
  <div class="card-announce-box">
    <div class="card-announce-player" id="announcePlayer"></div>
    <div class="card-announce-name" id="announceCardName"></div>
    <div class="card-announce-target" id="announceTarget"></div>
    <div class="card-announce-desc" id="announceDesc"></div>
    <div class="card-announce-effects" id="announceEffects"></div>
  </div>
</div>

<div id="mainMenu" class="screen active">
  <h1 data-i18n="title">🌍 SDG 永續桌遊</h1>
  <div class="menu-box">
    <p style="color:var(--muted);margin-bottom:16px;" data-i18n="chooseMode">選擇遊戲模式</p>
    <button class="large success" id="btnPVC" data-i18n="pvc">單人 / 機器人模式 (PVC)</button>
    <button class="large" id="btnPVP" data-i18n="pvp">多人對戰模式 (PVP)</button>
  </div>
</div>

<div id="pvpMenu" class="screen">
  <h1 data-i18n="pvpTitle">多人對戰</h1>
  <div class="menu-box">
    <button class="large success" id="btnLocal" data-i18n="localPlay">同一裝置遊玩 (Local)</button>
    <button class="large" id="btnOnline" data-i18n="onlinePlay">跨裝置線上連線 (Online)</button>
    <button class="large danger" id="btnBackMain" style="margin-top:16px;" data-i18n="back">返回主選單</button>
  </div>
</div>

<div id="setupScreen" class="screen">
  <h1 data-i18n="setup">遊戲設定</h1>
  <div class="setup-box">
    <h2 data-i18n="playerCount">玩家人數</h2>
    <select id="playerCount">
      <option value="3">3</option>
      <option value="4" selected>4</option>
      <option value="5">5</option>
      <option value="6">6</option>
    </select>
    <div id="nameInputs" style="margin-top:14px;"></div>
    <button id="startBtn" class="success" style="width:100%;margin-top:16px;padding:12px;" data-i18n="enterDraft">進入 SDG 挑選</button>
    <button class="danger" id="btnBackFromSetup" style="width:100%;margin-top:8px;" data-i18n="back">返回</button>
  </div>
</div>

<div id="draftScreen" class="screen">
  <h1 data-i18n="draftTitle">🎯 SDG 目標挑選</h1>
  <div class="draft-status" id="draftStatus"></div>
  <div class="draft-selected-count" id="draftCount"></div>
  <div class="draft-grid" id="draftGrid"></div>
  <div style="text-align:center;margin-top:12px;">
    <button id="btnConfirmDraft" class="success" disabled data-i18n="confirmSDG">確認選擇 SDG</button>
  </div>
  <div id="draftPicks" style="margin-top:14px;text-align:center;color:var(--muted);"></div>
</div>

<div id="gameScreen" class="screen">
  <div class="game-layout">
    <div class="board">
      <div class="phase-bar">
        <div>
          <span class="phase-label" id="phaseLabel"></span>
          <span id="turnInfo" style="margin-left:10px;"></span>
        </div>
        <div id="actionButtons">
          <button id="btnDiscardMode" data-i18n="discardMode">棄牌模式</button>
          <button id="btnPlayMode" class="success" data-i18n="playMode">打出卡牌</button>
          <button id="btnCancelAction" style="display:none;" data-i18n="cancel">取消選擇</button>
        </div>
      </div>
      <div class="players-grid" id="playersGrid"></div>
      <div class="deck-info">
        <span><span data-i18n="deck">抽牌堆</span>：<strong id="deckCount">0</strong></span>
        <span><span data-i18n="discard">棄牌堆</span>：<strong id="discardCount">0</strong></span>
      </div>
      <div class="hand-area">
        <h2><span data-i18n="hand">目前玩家手牌</span> <span id="handCount"></span></h2>
        <div class="hand-cards" id="handCards"></div>
        <div class="confirm-bar" id="confirmBar" style="display:none;">
          <button id="btnConfirmAction" class="success" data-i18n="confirmAction">確認執行行動</button>
        </div>
      </div>
    </div>
    <div class="log-panel">
      <h2 data-i18n="log">遊戲歷程</h2>
      <div class="log-content" id="logContent"></div>
    </div>
  </div>
</div>

<div id="winScreen" class="screen">
  <div class="win-screen">
    <h1 data-i18n="victory">🏆 勝利！</h1>
    <p id="winnerText" style="font-size:1.3rem;margin:16px 0;"></p>
    <button onclick="location.reload()" class="success" data-i18n="playAgain">再玩一次</button>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

function trackTimeout(fn, ms) {
  if (state.isGameOver) return null;
  var id = setTimeout(function() {
    state.timers = state.timers.filter(function(t) { return t !== id; });
    if (!state.isGameOver) fn();
  }, ms);
  state.timers.push(id);
  return id;
}
function clearAllTimers() {
  state.timers.forEach(function(id) { clearTimeout(id); });
  state.timers = [];
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function log(msg, type) {
  type = type || "";
  var el = document.getElementById("logContent");
  if (!el) return;
  var d = document.createElement("div");
  d.className = "log-entry " + type;
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(function(s) { s.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
}

function delay(ms) { return new Promise(function(r) { trackTimeout(r, ms); }); }

function showModal(title, bodyHtml, actions) {
  if (state.isGameOver) return;
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = bodyHtml;
  var act = document.getElementById("modalActions");
  act.innerHTML = "";
  (actions || []).forEach(function(a) {
    var b = document.createElement("button");
    b.textContent = a.label;
    if (a.class) b.className = a.class;
    b.onclick = function() { hideModal(); a.fn(); };
    act.appendChild(b);
  });
  document.getElementById("modal").classList.add("show");
}
function hideModal() { document.getElementById("modal").classList.remove("show"); }

function showCardAnnouncement(playerName, card, options) {
  options = options || {};
  return new Promise(function(resolve) {
    if (state.isGameOver) { resolve(); return; }
    state.inputLocked = true;
    document.getElementById("announcePlayer").textContent = playerName + " " + t("played");
    document.getElementById("announceCardName").textContent = cardName(card.name);
    var targetEl = document.getElementById("announceTarget");
    if (options.targetName) {
      targetEl.style.display = "block";
      targetEl.textContent = "➤ " + options.targetName;
    } else {
      targetEl.style.display = "none";
    }
    document.getElementById("announceDesc").textContent = card.desc || "";
    var effectsEl = document.getElementById("announceEffects");
    effectsEl.innerHTML = "";
    var affected = options.affectedSDGs || [];
    if (affected.length) {
      affected.forEach(function(a) {
        var tag = document.createElement("span");
        tag.className = "effect-tag " + (a.delta > 0 ? "up" : "down");
        tag.textContent = "SDG " + a.id + (a.delta > 0 ? " 📈 +" : " 📉 ") + a.delta;
        effectsEl.appendChild(tag);
      });
    } else if (card.kind === "event") {
      (card.forward || []).forEach(function(id) {
        var tag = document.createElement("span");
        tag.className = "effect-tag up";
        tag.textContent = "SDG " + id + " 📈 +1";
        effectsEl.appendChild(tag);
      });
      (card.backward || []).forEach(function(id) {
        var tag = document.createElement("span");
        tag.className = "effect-tag down";
        tag.textContent = "SDG " + id + " 📉 -1";
        effectsEl.appendChild(tag);
      });
    } else {
      var tag = document.createElement("span");
      tag.className = "effect-tag special";
      tag.textContent = t("special");
      effectsEl.appendChild(tag);
    }
    var modal = document.getElementById("card-play-modal");
    modal.classList.remove("fade-out");
    modal.classList.add("show");
    trackTimeout(function() {
      modal.classList.add("fade-out");
      trackTimeout(function() {
        modal.classList.remove("show", "fade-out");
        state.inputLocked = false;
        resolve();
      }, 320);
    }, 3000);
  });
}

  box.innerHTML = "";
  for (var i = 0; i < count; i++) {
    var div = document.createElement("div");
    div.className = "player-setup";
    if (mode === "pvp") {
      div.innerHTML = "<label>" + t("player") + " " + (i+1) + "</label>" +
        "<input type=\"text\" id=\"pname" + i + "\" value=\"" + t("player") + (i+1) + "\" maxlength=\"12\">" +
        "<select id=\"ptype" + i + "\" disabled><option value=\"human\" selected>" + t("human") + "</option></select>";
    } else {
      var def = i === 0 ? "human" : "basic";
      div.innerHTML = "<label>" + t("player") + " " + (i+1) + "</label>" +
        "<input type=\"text\" id=\"pname" + i + "\" value=\"" + (i===0 ? t("player")+"1" : "Bot"+i) + "\" maxlength=\"12\">" +
        "<select id=\"ptype" + i + "\">" +
        "<option value=\"human\"" + (def==="human"?" selected":"") + ">" + t("human") + "</option>" +
        "<option value=\"easy\">" + t("easyBot") + "</option>" +
        "<option value=\"basic\"" + (def==="basic"?" selected":"") + ">" + t("basicBot") + "</option>" +
        "<option value=\"advance\">" + t("advanceBot") + "</option></select>";
    }
    box.appendChild(div);
  }
}

  renderNameInputs(state.mode === "pvp-local" ? "pvp" : "pvc");
};
document.getElementById("startBtn").onclick = startLocalDraft;

function startLocalDraft() {
  var count = parseInt(document.getElementById("playerCount").value, 10);
  var names = [], types = [];
  for (var i = 0; i < count; i++) {
    names.push(document.getElementById("pname"+i).value.trim() || (t("player")+(i+1)));
    types.push(document.getElementById("ptype"+i).value);
  }
  state.players = names.map(function(n, i) {
    var isAI = types[i] !== "human";
    return { name: n, isAI: isAI, difficulty: isAI ? types[i] : "basic", sdgs: [], hand: [], sanctioned: false, capacityNext: false };
  });
  state.isGameOver = false;
  clearAllTimers();
  state.draftAvailable = [];
  for (var k = 1; k <= 17; k++) state.draftAvailable.push(k);
  shuffle(state.draftAvailable);
  state.draftCurrentPlayer = 0;
  state.draftSelected = [];
  showScreen("draftScreen");
  renderDraft();
}

/* ========== DRAFT ========== */
function renderDraft() {
  if (state.isGameOver) return;
  var p = state.players[state.draftCurrentPlayer];
  document.getElementById("draftStatus").textContent = t("turnOf") + " " + p.name + (p.isAI ? " (Bot)" : "") + " " + t("select2");
  document.getElementById("draftCount").textContent = t("selected") + " " + state.draftSelected.length + " / 2";
  var grid = document.getElementById("draftGrid");
  grid.innerHTML = "";
  for (var id = 1; id <= 17; id++) {
    var avail = state.draftAvailable.indexOf(id) !== -1;
    var sel = state.draftSelected.indexOf(id) !== -1;
    var div = document.createElement("div");
    div.className = "sdg-pick" + (!avail ? " disabled" : "") + (sel ? " selected" : "");
    div.innerHTML = "<strong>SDG " + id + "</strong><br><span style=\"font-size:0.74rem;color:#8a7a6a;\">" + sdgName(id) + "</span>";
    if (avail && !p.isAI) {
      (function(sid) { div.onclick = function() { toggleDraftSelect(sid); }; })(id);
    }
    grid.appendChild(div);
  }
  document.getElementById("draftPicks").textContent = state.players.map(function(pl) {
    return pl.name + ": " + (pl.sdgs.map(function(x){return "SDG "+x.id;}).join(", ") || "—");
  }).join(" ｜ ");
  document.getElementById("btnConfirmDraft").disabled = state.draftSelected.length !== 2 || p.isAI;
  if (p.isAI) {
    showAINotice("[" + p.name + "] " + t("aiDraft"));
    log("[" + p.name + "] " + t("aiDraft"), "ai");
    trackTimeout(function() {
      hideAINotice();
      aiDraftPick();
    }, 1000);
  }
}
function toggleDraftSelect(id) {
  var idx = state.draftSelected.indexOf(id);
  if (idx >= 0) state.draftSelected.splice(idx, 1);
  else if (state.draftSelected.length < 2) state.draftSelected.push(id);
  renderDraft();
}
document.getElementById("btnConfirmDraft").onclick = function() {
  if (state.draftSelected.length !== 2) return;
  confirmDraftPick(state.draftSelected.slice());
};
function confirmDraftPick(ids) {
  var p = state.players[state.draftCurrentPlayer];
  ids.forEach(function(id) {
    p.sdgs.push({ id: id, progress: 0, frozen: false, immune: false });
    state.draftAvailable = state.draftAvailable.filter(function(x) { return x !== id; });
  });
  state.draftSelected = [];
  state.draftCurrentPlayer++;
  if (state.draftCurrentPlayer >= state.players.length) {
    startGameAfterDraft();
    return;
  }
  renderDraft();
}
function aiDraftPick() {
  if (state.isGameOver) return;
  var p = state.players[state.draftCurrentPlayer];
  if (!p.isAI || state.draftAvailable.length < 2) return;
  var picks = p.difficulty === "easy"
    ? shuffle(state.draftAvailable.slice()).slice(0, 2)
    : state.draftAvailable.slice().sort(function(a,b){ return Math.abs(a-8.5)-Math.abs(b-8.5); }).slice(0, 2);
  state.draftSelected = picks;
  renderDraft();
  trackTimeout(function() { confirmDraftPick(picks); }, 400);
}

function startGameAfterDraft() {
  state.unusedSDGs = state.draftAvailable.slice();
  shuffle(state.unusedSDGs);
  state.deck = [];
  eventCards.forEach(function(c) {
    state.deck.push({ name: c.name, forward: c.forward.slice(), backward: c.backward.slice(), desc: c.desc, kind: "event", id: Math.random().toString(36).slice(2) });
  });
  specialCards.forEach(function(c) {
    for (var i = 0; i < 2; i++) {
      state.deck.push({ name: c.name, type: c.type, desc: c.desc, kind: "special", id: Math.random().toString(36).slice(2) + i });
    }
  });
  shuffle(state.deck);
  state.discard = [];
  state.players.forEach(function(p) {
    for (var i = 0; i < 5; i++) {
      if (state.deck.length === 0) reshuffle();
      p.hand.push(state.deck.pop());
    }
  });
  state.currentPlayer = 0;
  state.phase = "action";
  state.modeAction = null;
  state.selectedCards = [];
  state.maxPlay = 2;
  state.capacityActive = false;
  state.isAIThinking = false;
  state.previewDeltas = {};
  state.isGameOver = false;
  showScreen("gameScreen");
  log(t("gameStart"), "sys");
  log(getCurrentPlayer().name + " " + t("pleaseStart"), "sys");
  updateUI();
  maybeTriggerAI();
}
function reshuffle() {
  if (state.discard.length === 0) return;
  state.deck = state.discard.splice(0);
  shuffle(state.deck);
  log(t("reshuffle"), "sys");
}

/* ========== UI ========== */
function computePreview() {
  state.previewDeltas = {};
  var p = getCurrentPlayer();
  if (state.modeAction !== "play" || !state.selectedCards.length || p.isAI) return;
  state.selectedCards.forEach(function(idx) {
    var card = p.hand[idx];
    if (!card || card.kind !== "event") return;
    (card.forward || []).forEach(function(id) {
      state.players.forEach(function(pl, pi) {
        pl.sdgs.forEach(function(s, si) {
          if (s.id === id && s.progress < 3 && !s.frozen) {
            if (!state.previewDeltas[pi]) state.previewDeltas[pi] = {};
            state.previewDeltas[pi][si] = (state.previewDeltas[pi][si] || 0) + 1;
          }
        });
      });
    });
    (card.backward || []).forEach(function(id) {
      state.players.forEach(function(pl, pi) {
        pl.sdgs.forEach(function(s, si) {
          if (s.id === id && s.progress < 3 && !s.frozen && !s.immune) {
            if (!state.previewDeltas[pi]) state.previewDeltas[pi] = {};
            state.previewDeltas[pi][si] = (state.previewDeltas[pi][si] || 0) - 1;
          }
        });
      });
    });
  });
}

function updateUI() {
  if (state.isGameOver) return;
  var p = getCurrentPlayer();
  if (!p) return;
  document.getElementById("turnInfo").textContent = t("turnOf") + " " + p.name + (p.isAI ? " (Bot)" : "");
  document.getElementById("deckCount").textContent = state.deck.length;
  document.getElementById("discardCount").textContent = state.discard.length;
  document.getElementById("handCount").textContent = "(" + p.hand.length + "/5)";
  var phaseText = t("actionPhase");
  if (state.isAIThinking) phaseText = t("botThinking");
  else if (state.modeAction === "discard") phaseText = t("discardPhase");
  else if (state.modeAction === "play") phaseText = t("playPhase") + " " + state.maxPlay + " " + t("cards");
  document.getElementById("phaseLabel").textContent = phaseText;
  document.getElementById("phaseLabel").className = "phase-label" + (state.isAIThinking ? " ai-thinking" : "");

  var humanTurn = !p.isAI && state.phase === "action" && !state.isAIThinking && !state.inputLocked && !state.isGameOver;
  var btnD = document.getElementById("btnDiscardMode");
  var btnP = document.getElementById("btnPlayMode");
  var btnC = document.getElementById("btnCancelAction");
  var conf = document.getElementById("confirmBar");
  if (humanTurn && !state.modeAction) {
    btnD.style.display = ""; btnP.style.display = ""; btnC.style.display = "none"; conf.style.display = "none";
  } else if (humanTurn && (state.modeAction === "discard" || state.modeAction === "play")) {
    btnD.style.display = "none"; btnP.style.display = "none"; btnC.style.display = "";
    conf.style.display = state.selectedCards.length ? "flex" : "none";
  } else {
    btnD.style.display = "none"; btnP.style.display = "none"; btnC.style.display = "none"; conf.style.display = "none";
  }

  computePreview();
  var grid = document.getElementById("playersGrid");
  grid.innerHTML = "";
  state.players.forEach(function(pl, idx) {
    var div = document.createElement("div");
    div.className = "player-card" + (idx === state.currentPlayer ? " current" : "") + (pl.sanctioned ? " sanctioned" : "") + (pl.isAI ? " ai-tag" : "");
    div.setAttribute("data-sanction", t("sanctioned"));
    var html = "<div class=\"player-name\">" + pl.name + (idx === state.currentPlayer ? " ▶" : "") + (pl.isAI ? " [" + pl.difficulty + "]" : "") + "</div>";
    pl.sdgs.forEach(function(s, si) {
      var cur = s.progress;
      var delta = (state.previewDeltas[idx] && state.previewDeltas[idx][si]) || 0;
      var preview = clamp(cur + delta, -2, 3);
      var pct = ((cur + 2) / 5) * 100;
      var previewPct = ((preview + 2) / 5) * 100;
      html += "<div class=\"sdg-row\"><div class=\"sdg-badge " + (cur >= 3 ? "goal" : "") + (s.frozen ? " frozen" : "") + "\">SDG " + s.id + "</div>" +
        "<div class=\"progress-bar\"><div class=\"progress-fill " + (cur < 0 ? "negative" : "") + "\" style=\"width:" + pct + "%\"></div>" +
        (delta !== 0 ? "<div class=\"progress-preview " + (delta < 0 ? "negative" : "") + "\" style=\"left:0;width:" + Math.max(pct, previewPct) + "%;\"></div>" : "") +
        "<div class=\"progress-text\">" + (cur >= 3 ? t("goal") : cur) + (delta ? " →" + preview : "") + (s.frozen ? " ❄" : "") + (s.immune ? " 🛡" : "") + "</div></div></div>" +
        "<div class=\"progress-labels\"><span>-2</span><span>-1</span><span>0</span><span>1</span><span>2</span><span>GOAL</span></div>" +
        "<div style=\"font-size:0.66rem;color:#8a7a6a;margin-bottom:2px;\">" + sdgName(s.id) + "</div>";
    });
    div.innerHTML = html;
    grid.appendChild(div);
  });

  var handEl = document.getElementById("handCards");
  handEl.innerHTML = "";
  p.hand.forEach(function(card, idx) {
    var cannot = state.modeAction === "play" && card.type === "veto";
    var div = document.createElement("div");
    div.className = "card " + (card.kind === "event" ? "event" : "special") +
      (state.selectedCards.indexOf(idx) !== -1 ? " selected" : "") + (cannot ? " disabled-card" : "");
    var effect = "";
    if (card.kind === "event") {
      effect = "<div class=\"card-fwd\">" + (card.forward.length ? t("forward") + ":" + card.forward.join(",") : "") + "</div>" +
               "<div class=\"card-bwd\">" + (card.backward.length ? t("backward") + ":" + card.backward.join(",") : "") + "</div>";
    } else {
      effect = "<div class=\"card-effect\">" + (card.desc || "") + "</div>";
    }
    div.innerHTML = "<div class=\"card-header\">" + (card.kind === "event" ? t("historyEvent") : t("specialCard")) + "</div>" +
      "<div class=\"card-body\"><div class=\"card-name\">" + cardName(card.name) + "</div>" + effect + "</div>";
    if (!p.isAI && !cannot && !state.inputLocked && !state.isGameOver) {
      (function(i) { div.onclick = function() { onCardClick(i); }; })(idx);
    }
    handEl.appendChild(div);
  });
}

/* ========== ACTIONS ========== */
document.getElementById("btnDiscardMode").onclick = function() {
  if (state.inputLocked || state.isGameOver) return;
  state.modeAction = "discard"; state.selectedCards = []; updateUI();
};
document.getElementById("btnPlayMode").onclick = function() {
  if (state.inputLocked || state.isGameOver) return;
  state.modeAction = "play";
  state.maxPlay = getCurrentPlayer().sanctioned ? 1 : 2;
  state.selectedCards = []; updateUI();
};
document.getElementById("btnCancelAction").onclick = function() {
  state.modeAction = null; state.selectedCards = []; state.previewDeltas = {}; updateUI();
};
document.getElementById("btnConfirmAction").onclick = function() {
  if (state.inputLocked || state.isGameOver || !state.selectedCards.length) return;
  if (state.modeAction === "discard") executeDiscard();
  else executePlay();
};

function onCardClick(idx) {
  if (state.inputLocked || state.isGameOver || state.phase !== "action" || !state.modeAction || getCurrentPlayer().isAI) return;
  var card = getCurrentPlayer().hand[idx];
  if (state.modeAction === "play" && card.type === "veto") return;
  if (state.modeAction === "discard") {
    var pos = state.selectedCards.indexOf(idx);
    if (pos >= 0) state.selectedCards.splice(pos, 1); else state.selectedCards.push(idx);
  } else {
    var pos2 = state.selectedCards.indexOf(idx);
    if (pos2 >= 0) state.selectedCards.splice(pos2, 1);
    else {
      if (state.selectedCards.length >= state.maxPlay) state.selectedCards.shift();
      state.selectedCards.push(idx);
    }
  }
  updateUI();
}

function executeDiscard() {
  var p = getCurrentPlayer();
  state.selectedCards.slice().sort(function(a,b){return b-a;}).forEach(function(i) {
    var c = p.hand.splice(i, 1)[0];
    state.discard.push(c);
    log(p.name + " " + t("discarded") + "「" + cardName(c.name) + "」");
  });
  state.selectedCards = []; state.modeAction = null;
  endActionPhase();
}

async function executePlay() {
  var p = getCurrentPlayer();
  var sorted = state.selectedCards.slice().sort(function(a,b){return b-a;});
  var cards = [];
  sorted.forEach(function(i) { cards.unshift(p.hand.splice(i, 1)[0]); });
  cards.forEach(function(c) { state.discard.push(c); });
  state.selectedCards = []; state.modeAction = null;
  for (var ci = 0; ci < cards.length; ci++) {
    if (state.isGameOver) break;
    var card = cards[ci];
    var affected = [];
    if (card.kind === "event") {
      (card.forward || []).forEach(function(id) { affected.push({id:id, delta:1}); });
      (card.backward || []).forEach(function(id) { affected.push({id:id, delta:-1}); });
    }
    await showCardAnnouncement(p.name, card, { affectedSDGs: affected });
    log(p.name + " " + t("played") + "「" + cardName(card.name) + "」", card.kind === "event" ? "up" : "special");
    updateUI();
    await new Promise(function(r) { resolveCard(card, false, r); });
    await delay(120);
  }
  if (!state.isGameOver) endActionPhase();
}

function endActionPhase() {
  if (state.isGameOver) return;
  state.modeAction = null; state.selectedCards = [];
  getCurrentPlayer().sdgs.forEach(function(s) { s.immune = false; });
  state.phase = "draw";
  doDrawPhase();
}

function doDrawPhase() {
  if (state.isGameOver) return;
  var p = getCurrentPlayer();
  var need = 5 - p.hand.length;
  if (p.capacityNext) { need += 1; p.capacityNext = false; state.capacityActive = true; }
  var drawn = [];
  for (var i = 0; i < need; i++) {
    if (state.deck.length === 0) reshuffle();
    if (state.deck.length === 0) break;
    drawn.push(state.deck.pop());
  }
  if (state.capacityActive && drawn.length) {
    state.capacityActive = false;
    if (p.isAI) {
      var ri = Math.floor(Math.random() * drawn.length);
      state.discard.push(drawn.splice(ri, 1)[0]);
      p.hand = p.hand.concat(drawn);
      finishTurn();
    } else {
      var body = "<div class=\"modal-list\">" + drawn.map(function(c, i) {
        return "<button data-i=\"" + i + "\">" + cardName(c.name) + "</button>";
      }).join("") + "</div>";
      showModal(t("capacityChoose"), body, []);
      setTimeout(function() {
        document.querySelectorAll("#modalBody button").forEach(function(btn) {
          btn.onclick = function() {
            var i = parseInt(btn.getAttribute("data-i"), 10);
            state.discard.push(drawn.splice(i, 1)[0]);
            p.hand = p.hand.concat(drawn);
            hideModal();
            finishTurn();
          };
        });
      }, 30);
    }
  } else {
    p.hand = p.hand.concat(drawn);
    if (drawn.length) log(p.name + " +" + drawn.length);
    finishTurn();
  }
}

function finishTurn() {
  if (state.isGameOver) return;
  var next = (state.currentPlayer + 1) % state.players.length;
  getCurrentPlayer().sanctioned = false;
  state.players[next].sdgs.forEach(function(s) { s.frozen = false; });
  state.currentPlayer = next;
  state.phase = "action";
  state.modeAction = null;
  log("── " + t("turnOf") + " " + getCurrentPlayer().name + " ──", "sys");
  checkWin();
  if (!state.isGameOver) { updateUI(); maybeTriggerAI(); }
}

/* ========== AI ========== */
async function maybeTriggerAI() {
  if (state.isGameOver) return;
  var p = getCurrentPlayer();
  if (!p || !p.isAI || state.phase !== "action") return;
  state.isAIThinking = true;
  updateUI();
  showAINotice("[" + p.name + "] " + t("aiPlay"));
  log("[" + p.name + "] " + t("aiPlay"), "ai");
  await delay(1000);
  hideAINotice();
  if (state.isGameOver) return;

  var playable = [];
  p.hand.forEach(function(c, i) { if (c.type !== "veto") playable.push(i); });
  if (playable.length && Math.random() > 0.28) {
    var n = Math.min(playable.length, p.sanctioned ? 1 : 2);
    shuffle(playable);
    var idxs = playable.slice(0, n);
    var cards = [];
    idxs.sort(function(a,b){return b-a;}).forEach(function(i) { cards.unshift(p.hand.splice(i, 1)[0]); });
    cards.forEach(function(c) { state.discard.push(c); });
    for (var ci = 0; ci < cards.length; ci++) {
      if (state.isGameOver) break;
      var card = cards[ci];
      var affected = [];
      if (card.kind === "event") {
        (card.forward || []).forEach(function(id) { affected.push({id:id, delta:1}); });
        (card.backward || []).forEach(function(id) { affected.push({id:id, delta:-1}); });
      }
      await showCardAnnouncement(p.name, card, { affectedSDGs: affected });
      log(p.name + " " + t("played") + "「" + cardName(card.name) + "」", "ai");
      await new Promise(function(r) { resolveCard(card, true, r); });
    }
  } else {
    var n2 = Math.min(2, p.hand.length);
    for (var j = 0; j < n2; j++) {
      var c = p.hand.pop();
      state.discard.push(c);
      log(p.name + " " + t("discarded") + "「" + cardName(c.name) + "」", "ai");
    }
  }
  state.isAIThinking = false;
  if (!state.isGameOver) endActionPhase();
}

/* ========== RESOLVE + INTERACTIVE MODALS ========== */
function isValidNegativeTarget(s) { return s.progress < 3 && !s.immune && !s.frozen; }

function resolveCard(card, isAI, done) {
  if (state.isGameOver) { done(); return; }
  if (card.kind === "event") resolveEvent(card, isAI, done);
  else resolveSpecial(card, isAI, done);
}

function resolveEvent(card, isAI, done) {
  (card.forward || []).forEach(function(id) {
    state.players.forEach(function(pl) {
      pl.sdgs.forEach(function(s) {
        if (s.id === id && s.progress < 3 && !s.frozen) {
          s.progress = clamp(s.progress + 1, -2, 3);
          log(pl.name + " SDG " + id + " → " + s.progress, "up");
        }
      });
    });
  });
  if (!card.backward || !card.backward.length) { done(); return; }
  var targets = [];
  state.players.forEach(function(pl) {
    pl.sdgs.forEach(function(s) {
      if (card.backward.indexOf(s.id) !== -1 && isValidNegativeTarget(s)) targets.push({pl:pl, s:s});
    });
  });
  if (!targets.length) { log(t("noValid")); done(); return; }
  var i = 0;
  function next() {
    if (state.isGameOver || i >= targets.length) { done(); return; }
    var tObj = targets[i++];
    var vIdx = -1;
    for (var vi = 0; vi < tObj.pl.hand.length; vi++) {
      if (tObj.pl.hand[vi].type === "veto") { vIdx = vi; break; }
    }
    if (vIdx >= 0 && !tObj.pl.isAI) {
      showModal(t("useVeto"), "<p>" + tObj.pl.name + " SDG " + tObj.s.id + "</p>", [
        { label: t("yes"), class: "success", fn: function() {
          tObj.pl.hand.splice(vIdx, 1);
          state.discard.push({type:"veto"});
          log(tObj.pl.name + " Veto", "special");
          next();
        }},
        { label: t("no"), class: "danger", fn: function() {
          tObj.s.progress = clamp(tObj.s.progress - 1, -2, 3);
          log(tObj.pl.name + " SDG " + tObj.s.id + " → " + tObj.s.progress, "down");
          next();
        }}
      ]);
    } else {
      if (vIdx >= 0 && tObj.pl.isAI && tObj.pl.difficulty === "advance") {
        tObj.pl.hand.splice(vIdx, 1);
        log(tObj.pl.name + " Veto", "ai");
      } else {
        tObj.s.progress = clamp(tObj.s.progress - 1, -2, 3);
        log(tObj.pl.name + " SDG " + tObj.s.id + " → " + tObj.s.progress, "down");
      }
      next();
    }
  }
  next();
}

function resolveSpecial(card, isAI, done) {
  var p = getCurrentPlayer();

  if (card.type === "capacity") {
    p.capacityNext = true;
    log(p.name + " Capacity", "special");
    done();
    return;
  }

  if (card.type === "immunity") {
    if (isAI) {
      p.sdgs[0].immune = true;
      log(p.name + " Immunity", "ai");
      done();
    } else {
      var body = "<div class=\"modal-list\">" + p.sdgs.map(function(s, i) {
        return "<button data-i=\"" + i + "\">SDG " + s.id + " (" + sdgName(s.id) + ")</button>";
      }).join("") + "</div>";
      showModal(t("selectOwnSDG"), body, []);
      setTimeout(function() {
        document.querySelectorAll("#modalBody button").forEach(function(btn) {
          btn.onclick = function() {
            var i = parseInt(btn.getAttribute("data-i"), 10);
            p.sdgs[i].immune = true;
            log(p.name + " SDG " + p.sdgs[i].id + " immune", "special");
            hideModal();
            done();
          };
        });
      }, 30);
    }
    return;
  }

  if (card.type === "freeze" || card.type === "sanction") {
    var opps = state.players.filter(function(pl) { return pl !== p; });
    if (isAI) {
      showAINotice("[" + p.name + "] " + t("aiTarget"));
      trackTimeout(function() {
        hideAINotice();
        if (card.type === "freeze") {
          var best = null;
          opps.forEach(function(pl) {
            pl.sdgs.forEach(function(s) {
              if (isValidNegativeTarget(s) && (!best || s.progress > best.s.progress)) best = {pl:pl, s:s};
            });
          });
          if (best) { best.s.frozen = true; log("[" + p.name + "] → [" + best.pl.name + "] Freeze", "special"); }
        } else {
          var bestP = null, max = -99;
          opps.forEach(function(pl) {
            var tot = pl.sdgs.reduce(function(a,s){return a+s.progress;},0);
            if (tot > max) { max = tot; bestP = pl; }
          });
          if (bestP) { bestP.sanctioned = true; log("[" + p.name + "] → [" + bestP.name + "] Sanction", "special"); }
        }
        done();
      }, 1000);
    } else {
      var body = "<div class=\"modal-list\">" + opps.map(function(pl, i) {
        return "<button data-i=\"" + state.players.indexOf(pl) + "\">" + pl.name + "</button>";
      }).join("") + "</div>";
      showModal(t("selectTarget"), body, []);
      setTimeout(function() {
        document.querySelectorAll("#modalBody button").forEach(function(btn) {
          btn.onclick = function() {
            var ti = parseInt(btn.getAttribute("data-i"), 10);
            var target = state.players[ti];
            hideModal();
            if (card.type === "freeze") {
              var valid = target.sdgs.filter(function(s) { return isValidNegativeTarget(s); });
              if (!valid.length) { log(t("noValid")); done(); return; }
              var body2 = "<div class=\"modal-list\">" + target.sdgs.map(function(s, si) {
                if (!isValidNegativeTarget(s)) return "";
                return "<button data-si=\"" + si + "\">SDG " + s.id + "</button>";
              }).join("") + "</div>";
              showModal("Freeze SDG", body2, []);
              setTimeout(function() {
                document.querySelectorAll("#modalBody button").forEach(function(b2) {
                  b2.onclick = function() {
                    var si = parseInt(b2.getAttribute("data-si"), 10);
                    target.sdgs[si].frozen = true;
                    log("[" + p.name + "] → [" + target.name + "] Freeze SDG " + target.sdgs[si].id, "special");
                    hideModal();
                    done();
                  };
                });
              }, 30);
            } else {
              target.sanctioned = true;
              log("[" + p.name + "] → [" + target.name + "] Sanction", "special");
              done();
            }
          };
        });
      }, 30);
    }
    return;
  }

  /* 合作備忘錄 MOU */
  if (card.type === "tradeHand") {
    var opps = state.players.filter(function(pl) { return pl !== p && pl.hand.length > 0; });
    if (!opps.length || !p.hand.length) { log(t("noValid")); done(); return; }
    if (isAI) {
      showAINotice("[" + p.name + "] " + t("aiTarget"));
      trackTimeout(function() {
        hideAINotice();
        var target = randChoice(opps);
        var myC = p.hand.pop();
        var tC = target.hand.pop();
        p.hand.push(tC);
        target.hand.push(myC);
        log("[" + p.name + "] ↔ [" + target.name + "] MOU", "special");
        done();
      }, 1000);
    } else {
      var body = "<div class=\"modal-list\">" + opps.map(function(pl) {
        return "<button data-i=\"" + state.players.indexOf(pl) + "\">" + pl.name + "</button>";
      }).join("") + "</div>";
      showModal(t("selectTarget"), body, []);
      setTimeout(function() {
        document.querySelectorAll("#modalBody button").forEach(function(btn) {
          btn.onclick = function() {
            var ti = parseInt(btn.getAttribute("data-i"), 10);
            var target = state.players[ti];
            hideModal();
            var body2 = "<div class=\"modal-list\">" + p.hand.map(function(c, i) {
              return "<button data-i=\"" + i + "\">" + cardName(c.name) + "</button>";
            }).join("") + "</div>";
            showModal(t("selectOwnCard"), body2, []);
            setTimeout(function() {
              document.querySelectorAll("#modalBody button").forEach(function(b2) {
                b2.onclick = function() {
                  var mi = parseInt(b2.getAttribute("data-i"), 10);
                  hideModal();
                  var body3 = "<div class=\"modal-list\">" + target.hand.map(function(c, i) {
                    return "<button data-i=\"" + i + "\">" + cardName(c.name) + "</button>";
                  }).join("") + "</div>";
                  showModal(t("selectTheirCard"), body3, []);
                  setTimeout(function() {
                    document.querySelectorAll("#modalBody button").forEach(function(b3) {
                      b3.onclick = function() {
                        var ti2 = parseInt(b3.getAttribute("data-i"), 10);
                        var myC = p.hand.splice(mi, 1)[0];
                        var tC = target.hand.splice(ti2, 1)[0];
                        p.hand.push(tC);
                        target.hand.push(myC);
                        log("[" + p.name + "] ↔ [" + target.name + "] MOU", "special");
                        hideModal();
                        done();
                      };
                    });
                  }, 30);
                };
              });
            }, 30);
          };
        });
      }, 30);
    }
    return;
  }

  /* 目標重整 */
  if (card.type === "swapSDG") {
    var opps = state.players.filter(function(pl) { return pl !== p; });
    if (!opps.length) { done(); return; }
    if (isAI) {
      showAINotice("[" + p.name + "] " + t("aiTarget"));
      trackTimeout(function() {
        hideAINotice();
        var target = randChoice(opps);
        var tmp = p.sdgs[0];
        p.sdgs[0] = target.sdgs[0];
        target.sdgs[0] = tmp;
        log("[" + p.name + "] ↔ [" + target.name + "] Goal Realignment", "special");
        done();
      }, 1000);
    } else {
      var body = "<div class=\"modal-list\">" + opps.map(function(pl) {
        return "<button data-i=\"" + state.players.indexOf(pl) + "\">" + pl.name + "</button>";
      }).join("") + "</div>";
      showModal(t("selectTarget"), body, []);
      setTimeout(function() {
        document.querySelectorAll("#modalBody button").forEach(function(btn) {
          btn.onclick = function() {
            var ti = parseInt(btn.getAttribute("data-i"), 10);
            var target = state.players[ti];
            hideModal();
            var body2 = "<div class=\"modal-list\">" + p.sdgs.map(function(s, i) {
              return "<button data-i=\"" + i + "\">SDG " + s.id + " (" + s.progress + ")</button>";
            }).join("") + "</div>";
            showModal(t("selectOwnSDG"), body2, []);
            setTimeout(function() {
              document.querySelectorAll("#modalBody button").forEach(function(b2) {
                b2.onclick = function() {
                  var mi = parseInt(b2.getAttribute("data-i"), 10);
                  hideModal();
                  var body3 = "<div class=\"modal-list\">" + target.sdgs.map(function(s, i) {
                    return "<button data-i=\"" + i + "\">SDG " + s.id + " (" + s.progress + ")</button>";
                  }).join("") + "</div>";
                  showModal(t("selectTheirSDG"), body3, []);
                  setTimeout(function() {
                    document.querySelectorAll("#modalBody button").forEach(function(b3) {
                      b3.onclick = function() {
                        var ti2 = parseInt(b3.getAttribute("data-i"), 10);
                        var tmp = p.sdgs[mi];
                        p.sdgs[mi] = target.sdgs[ti2];
                        target.sdgs[ti2] = tmp;
                        log("[" + p.name + "] ↔ [" + target.name + "] Goal Realignment", "special");
                        hideModal();
                        done();
                      };
                    });
                  }, 30);
                };
              });
            }, 30);
          };
        });
      }, 30);
    }
    return;
  }

  /* 歷史借鏡 */
  if (card.type === "history") {
    if (!state.discard.length) { log(t("noValid")); done(); return; }
    if (isAI) {
      showAINotice("[" + p.name + "] " + t("aiTarget"));
      trackTimeout(function() {
        hideAINotice();
        var c = state.discard.pop();
        p.hand.push(c);
        log(p.name + " History Mirror: " + cardName(c.name), "special");
        done();
      }, 1000);
    } else {
      var body = "<div class=\"modal-list\">" + state.discard.map(function(c, i) {
        return "<button data-i=\"" + i + "\">" + cardName(c.name) + "</button>";
      }).join("") + "</div>";
      showModal(t("selectFromDiscard"), body, []);
      setTimeout(function() {
        document.querySelectorAll("#modalBody button").forEach(function(btn) {
          btn.onclick = function() {
            var i = parseInt(btn.getAttribute("data-i"), 10);
            var c = state.discard.splice(i, 1)[0];
            p.hand.push(c);
            log(p.name + " History Mirror: " + cardName(c.name), "special");
            hideModal();
            done();
          };
        });
      }, 30);
    }
    return;
  }

  /* 永續轉型 */
  if (card.type === "sustain") {
    if (!state.unusedSDGs.length) { log(t("noValid")); done(); return; }
    if (isAI) {
      showAINotice("[" + p.name + "] " + t("aiTarget"));
      trackTimeout(function() {
        hideAINotice();
        var newId = state.unusedSDGs.pop();
        var old = p.sdgs[0];
        state.unusedSDGs.push(old.id);
        p.sdgs[0] = { id: newId, progress: old.progress, frozen: false, immune: false };
        log(p.name + " Sustainable Transition → SDG " + newId, "special");
        done();
      }, 1000);
    } else {
      var body = "<div class=\"modal-list\">" + p.sdgs.map(function(s, i) {
        return "<button data-i=\"" + i + "\">SDG " + s.id + " (" + s.progress + ")</button>";
      }).join("") + "</div>";
      showModal(t("selectSDGSwap"), body, []);
      setTimeout(function() {
        document.querySelectorAll("#modalBody button").forEach(function(btn) {
          btn.onclick = function() {
            var i = parseInt(btn.getAttribute("data-i"), 10);
            var old = p.sdgs[i];
            var newId = state.unusedSDGs.pop();
            state.unusedSDGs.push(old.id);
            p.sdgs[i] = { id: newId, progress: old.progress, frozen: false, immune: false };
            log(p.name + " Sustainable Transition → SDG " + newId, "special");
            hideModal();
            done();
          };
        });
      }, 30);
    }
    return;
  }

  /* 國際援助請求 */
  if (card.type === "aid") {
    var opps = state.players.filter(function(pl) { return pl !== p; });
    if (isAI) {
      showAINotice("[" + p.name + "] " + t("aiTarget"));
      trackTimeout(function() {
        hideAINotice();
        var target = randChoice(opps);
        var myIds = p.sdgs.map(function(s) { return s.id; });
        var valid = [];
        target.hand.forEach(function(c, i) {
          if (c.kind === "event" && c.forward && c.forward.some(function(f) { return myIds.indexOf(f) !== -1; })) valid.push(i);
        });
        if (valid.length) {
          var idx = randChoice(valid);
          var c = target.hand.splice(idx, 1)[0];
          p.hand.push(c);
          log("[" + target.name + "] → [" + p.name + "] Aid: " + cardName(c.name), "special");
        } else log(t("noValid"));
        done();
      }, 1000);
    } else {
      var body = "<div class=\"modal-list\">" + opps.map(function(pl) {
        return "<button data-i=\"" + state.players.indexOf(pl) + "\">" + pl.name + "</button>";
      }).join("") + "</div>";
      showModal(t("selectTarget"), body, []);
      setTimeout(function() {
        document.querySelectorAll("#modalBody button").forEach(function(btn) {
          btn.onclick = function() {
            var ti = parseInt(btn.getAttribute("data-i"), 10);
            var target = state.players[ti];
            hideModal();
            var myIds = p.sdgs.map(function(s) { return s.id; });
            var valid = [];
            target.hand.forEach(function(c, i) {
              if (c.kind === "event" && c.forward && c.forward.some(function(f) { return myIds.indexOf(f) !== -1; })) {
                valid.push({ i: i, c: c });
              }
            });
            if (!valid.length) { log(t("noValid")); done(); return; }
            if (target.isAI) {
              var pick = randChoice(valid);
              var c = target.hand.splice(pick.i, 1)[0];
              p.hand.push(c);
              log("[" + target.name + "] → [" + p.name + "] Aid", "special");
              done();
            } else {
              var body2 = "<div class=\"modal-list\">" + valid.map(function(v) {
                return "<button data-i=\"" + v.i + "\">" + cardName(v.c.name) + "</button>";
              }).join("") + "</div>";
              showModal(t("aidChoose") + " (" + target.name + ")", body2, []);
              setTimeout(function() {
                document.querySelectorAll("#modalBody button").forEach(function(b2) {
                  b2.onclick = function() {
                    var i = parseInt(b2.getAttribute("data-i"), 10);
                    var c = target.hand.splice(i, 1)[0];
                    p.hand.push(c);
                    log("[" + target.name + "] → [" + p.name + "] Aid: " + cardName(c.name), "special");
                    hideModal();
                    done();
                  };
                });
              }, 30);
            }
          };
        });
      }, 30);
    }
    return;
  }

  log(cardName(card.name) + " OK", "special");
  done();
}

function checkWin() {
  for (var i = 0; i < state.players.length; i++) {
    var pl = state.players[i];
    if (pl.sdgs.every(function(s) { return s.progress >= 3; })) {
      state.isGameOver = true;
      clearAllTimers();
      state.isAIThinking = false;
      state.inputLocked = true;
      hideAINotice();
      showScreen("winScreen");
      document.getElementById("winnerText").textContent = pl.name + (currentLang === "en" ? " wins!" : " 率先完成兩項 SDG 目標！");
      log("🏆 " + pl.name + " WIN", "win");
      return;
    }
  }
}

/* init */
applyI18n();
</script>
</body>
</html>
