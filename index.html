<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDG 永續桌遊 | iGEM Wiki</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #22c55e;
    --accent2: #3b82f6;
    --danger: #ef4444;
    --warn: #f59e0b;
    --neg: #e63946;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  .screen { display: none; padding: 20px; max-width: 1400px; margin: 0 auto; }
  .screen.active { display: block; }
  h1 { text-align: center; margin-bottom: 20px; color: var(--accent); }
  h2 { margin: 15px 0 10px; color: var(--accent2); font-size: 1.2rem; }
  button {
    background: var(--accent2);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: 0.2s;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.danger { background: var(--danger); }
  button.warn { background: var(--warn); color: #111; }
  button.success { background: var(--accent); color: #111; }
  button.large { padding: 16px 28px; font-size: 1.15rem; width: 100%; max-width: 360px; margin: 8px auto; display: block; }
  input, select {
    background: var(--card);
    border: 1px solid #334155;
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.95rem;
  }
  .menu-box, .setup-box, .lobby-box {
    background: var(--card);
    padding: 28px;
    border-radius: 14px;
    max-width: 520px;
    margin: 0 auto;
    text-align: center;
  }
  .player-setup {
    margin: 12px 0;
    display: grid;
    grid-template-columns: 70px 1fr 110px 130px;
    gap: 8px;
    align-items: center;
    text-align: left;
  }
  .player-setup label { font-size: 0.9rem; color: var(--muted); }

  /* Draft */
  .draft-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
    margin: 16px 0;
  }
  .sdg-pick {
    background: #1e293b;
    border: 2px solid #475569;
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: 0.15s;
    user-select: none;
  }
  .sdg-pick:hover:not(.disabled):not(.selected) { border-color: var(--accent2); transform: translateY(-2px); }
  .sdg-pick.disabled { opacity: 0.32; cursor: not-allowed; border-color: #334155; }
  .sdg-pick.selected {
    border-color: var(--accent);
    background: #14532d;
    box-shadow: 0 0 0 2px var(--accent);
  }
  .sdg-pick.selected::after {
    content: "✓ 已選";
    display: block;
    font-size: 0.75rem;
    color: #86efac;
    margin-top: 4px;
  }
  .draft-status { text-align: center; margin: 12px 0; font-size: 1.1rem; color: var(--accent); }
  .draft-selected-count { text-align: center; color: var(--muted); margin-bottom: 8px; }

  .game-layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 16px;
  }
  @media (max-width: 1000px) {
    .game-layout { grid-template-columns: 1fr; }
  }
  .board {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
  }
  .players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .player-card {
    background: #0f172a;
    border: 2px solid #334155;
    border-radius: 10px;
    padding: 12px;
    position: relative;
  }
  .player-card.current {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(34,197,94,0.3);
  }
  .player-card.sanctioned::after {
    content: "制裁中";
    position: absolute;
    top: 6px; right: 8px;
    background: var(--danger);
    color: white;
    font-size: 0.7rem;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .player-card.ai-tag::before {
    content: "AI";
    position: absolute;
    top: 6px; left: 8px;
    background: #7c3aed;
    color: white;
    font-size: 0.65rem;
    padding: 1px 5px;
    border-radius: 3px;
  }
  .player-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 8px; padding-left: 28px; }
  .sdg-row {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
    align-items: center;
  }
  .sdg-badge {
    background: #1e3a5f;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.85rem;
    min-width: 70px;
    text-align: center;
  }
  .sdg-badge.goal { background: #166534; color: #bbf7d0; }
  .sdg-badge.frozen { outline: 2px solid #38bdf8; }
  .progress-bar {
    flex: 1;
    height: 18px;
    background: #1e293b;
    border-radius: 9px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #22c55e, #4ade80);
    transition: width 0.3s;
  }
  .progress-fill.negative {
    background: linear-gradient(90deg, #e63946, #ff6b6b);
  }
  .progress-preview {
    position: absolute;
    top: 0; bottom: 0;
    background: repeating-linear-gradient(
      90deg,
      rgba(34,197,94,0.35),
      rgba(34,197,94,0.35) 4px,
      rgba(34,197,94,0.15) 4px,
      rgba(34,197,94,0.15) 8px
    );
    border: 2px dashed #4ade80;
    border-radius: 9px;
    pointer-events: none;
    transition: all 0.25s;
  }
  .progress-preview.negative {
    background: repeating-linear-gradient(
      90deg,
      rgba(230,57,70,0.4),
      rgba(230,57,70,0.4) 4px,
      rgba(230,57,70,0.18) 4px,
      rgba(230,57,70,0.18) 8px
    );
    border-color: #e63946;
  }
  .progress-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 600;
    z-index: 2;
  }

  .hand-area {
    background: #0f172a;
    border-radius: 10px;
    padding: 12px;
    margin-top: 12px;
  }
  .hand-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 110px;
  }
  .card {
    background: #1e293b;
    border: 2px solid #475569;
    border-radius: 8px;
    padding: 8px;
    width: 150px;
    font-size: 0.78rem;
    cursor: pointer;
    transition: 0.15s;
    position: relative;
  }
  .card:hover { border-color: var(--accent2); transform: translateY(-2px); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .card.disabled-card { opacity: 0.4; cursor: not-allowed; }
  .card.event { border-left: 4px solid #f59e0b; }
  .card.special { border-left: 4px solid #a855f7; }
  .card-name { font-weight: 700; margin-bottom: 4px; color: #f1f5f9; }
  .card-effect { color: var(--muted); font-size: 0.72rem; }
  .card-fwd { color: #4ade80; }
  .card-bwd { color: #f87171; }

  .deck-info {
    display: flex;
    gap: 16px;
    margin: 12px 0;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .phase-bar {
    background: #1e3a5f;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .phase-label { font-weight: 600; color: var(--accent); }
  .ai-thinking {
    color: #c4b5fd;
    font-weight: 600;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .log-panel {
    background: var(--card);
    border-radius: 12px;
    padding: 14px;
    height: calc(100vh - 40px);
    max-height: 900px;
    display: flex;
    flex-direction: column;
  }
  .log-content {
    flex: 1;
    overflow-y: auto;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .log-entry { padding: 4px 0; border-bottom: 1px solid #1e293b; }
  .log-entry.sys { color: var(--accent2); }
  .log-entry.win { color: var(--accent); font-weight: 700; }
  .log-entry.ai { color: #c4b5fd; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 12px;
    padding: 24px;
    max-width: 480px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h3 { margin-bottom: 14px; color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

  .win-screen { text-align: center; padding: 60px 20px; }
  .win-screen h1 { font-size: 2.5rem; color: var(--accent); }

  .confirm-bar {
    margin-top: 12px;
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .room-id-display {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--accent);
    background: #0f172a;
    padding: 12px 20px;
    border-radius: 10px;
    margin: 12px 0;
    display: inline-block;
  }
  .lobby-players {
    text-align: left;
    margin: 16px 0;
    max-height: 260px;
    overflow-y: auto;
  }
  .lobby-player {
    padding: 8px 12px;
    background: #0f172a;
    border-radius: 8px;
    margin: 6px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .lobby-player.ready { border-left: 4px solid var(--accent); }
  .lobby-player.host { border-left: 4px solid var(--accent2); }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
  }
  .status-dot.ready { background: var(--accent); }
  .status-dot.wait { background: var(--muted); }
</style>
</head>
<body>

<!-- ========== MAIN MENU ========== -->
<div id="mainMenu" class="screen active">
  <h1>🌍 SDG 永續桌遊</h1>
  <div class="menu-box">
    <p style="color:var(--muted);margin-bottom:20px;">選擇遊戲模式</p>
    <button class="large success" id="btnPVC">單人 / 機器人模式 (PVC)</button>
    <button class="large" id="btnPVP">多人對戰模式 (PVP)</button>
  </div>
</div>

<!-- ========== PVP SUB MENU ========== -->
<div id="pvpMenu" class="screen">
  <h1>多人對戰</h1>
  <div class="menu-box">
    <button class="large success" id="btnLocal">同一裝置遊玩 (Local Pass & Play)</button>
    <button class="large" id="btnOnline">跨裝置線上連線 (Online Rooms)</button>
    <button class="large danger" id="btnBackMain" style="margin-top:20px;">返回主選單</button>
  </div>
</div>

<!-- ========== ONLINE MENU ========== -->
<div id="onlineMenu" class="screen">
  <h1>線上房間</h1>
  <div class="menu-box">
    <button class="large success" id="btnCreateRoom">建立房間 (Create Room)</button>
    <button class="large" id="btnJoinRoom">加入房間 (Join Room)</button>
    <button class="large danger" id="btnBackPVP" style="margin-top:20px;">返回</button>
  </div>
</div>

<!-- ========== CREATE ROOM ========== -->
<div id="createRoomScreen" class="screen">
  <h1>建立房間</h1>
  <div class="lobby-box">
    <label>總玩家人數</label>
    <select id="onlinePlayerCount" style="margin:10px 0;display:block;width:100%;">
      <option value="3">3 人</option>
      <option value="4" selected>4 人</option>
      <option value="5">5 人</option>
      <option value="6">6 人</option>
    </select>
    <label>你的暱稱</label>
    <input type="text" id="hostName" value="房主" maxlength="12" style="width:100%;margin:8px 0;">
    <button class="large success" id="btnDoCreate">建立並進入等候室</button>
    <button class="large danger" id="btnBackOnline1" style="margin-top:12px;">返回</button>
  </div>
</div>

<!-- ========== JOIN ROOM ========== -->
<div id="joinRoomScreen" class="screen">
  <h1>加入房間</h1>
  <div class="lobby-box">
    <label>房間號碼 (Room ID)</label>
    <input type="text" id="joinRoomId" placeholder="例如 SDG-8829" style="width:100%;margin:8px 0;text-transform:uppercase;">
    <label>你的暱稱</label>
    <input type="text" id="joinName" value="玩家" maxlength="12" style="width:100%;margin:8px 0;">
    <button class="large success" id="btnDoJoin">加入房間</button>
    <button class="large danger" id="btnBackOnline2" style="margin-top:12px;">返回</button>
  </div>
</div>

<!-- ========== LOBBY ========== -->
<div id="lobbyScreen" class="screen">
  <h1>等候室</h1>
  <div class="lobby-box">
    <div>房間號碼</div>
    <div class="room-id-display" id="lobbyRoomId">SDG-0000</div>
    <button id="btnCopyRoom" style="margin-bottom:16px;">一鍵複製房間號碼</button>
    <div id="lobbyStatus" style="color:var(--muted);margin-bottom:8px;">等待玩家加入...</div>
    <div class="lobby-players" id="lobbyPlayers"></div>
    <div style="margin-top:16px;">
      <button class="large success" id="btnReady" style="display:none;">準備就緒 (Ready)</button>
      <button class="large success" id="btnStartGame" style="display:none;">開始遊戲</button>
      <button class="large danger" id="btnLeaveLobby" style="margin-top:10px;">離開房間</button>
    </div>
  </div>
</div>

<!-- ========== PVC / LOCAL SETUP ========== -->
<div id="setupScreen" class="screen">
  <h1>遊戲設定</h1>
  <div class="setup-box">
    <h2>玩家人數</h2>
    <select id="playerCount">
      <option value="3">3 人</option>
      <option value="4" selected>4 人</option>
      <option value="5">5 人</option>
      <option value="6">6 人</option>
    </select>
    <div id="nameInputs" style="margin-top:16px;"></div>
    <button id="startBtn" class="success" style="width:100%;margin-top:20px;padding:14px;font-size:1.1rem;">進入 SDG 挑選</button>
    <button class="danger" id="btnBackFromSetup" style="width:100%;margin-top:10px;">返回</button>
  </div>
</div>

<!-- ========== DRAFT ========== -->
<div id="draftScreen" class="screen">
  <h1>🎯 SDG 目標挑選</h1>
  <div class="draft-status" id="draftStatus">輪到 玩家1 挑選 2 張 SDG</div>
  <div class="draft-selected-count" id="draftCount">已選 0 / 2</div>
  <div class="draft-grid" id="draftGrid"></div>
  <div style="text-align:center;margin-top:16px;">
    <button id="btnConfirmDraft" class="success" disabled>確認選擇 SDG</button>
  </div>
  <div id="draftPicks" style="margin-top:20px;text-align:center;color:var(--muted);"></div>
</div>

<!-- ========== GAME ========== -->
<div id="gameScreen" class="screen">
  <div class="game-layout">
    <div class="board">
      <div class="phase-bar">
        <div>
          <span class="phase-label" id="phaseLabel">行動階段</span>
          <span id="turnInfo" style="margin-left:12px;"></span>
        </div>
        <div id="actionButtons">
          <button id="btnDiscardMode">棄牌模式</button>
          <button id="btnPlayMode" class="success">打出卡牌</button>
          <button id="btnCancelAction" style="display:none;">取消選擇</button>
        </div>
      </div>
      <div class="players-grid" id="playersGrid"></div>
      <div class="deck-info">
        <span>抽牌堆：<strong id="deckCount">0</strong></span>
        <span>棄牌堆：<strong id="discardCount">0</strong></span>
      </div>
      <div class="hand-area">
        <h2>目前玩家手牌 <span id="handCount"></span></h2>
        <div class="hand-cards" id="handCards"></div>
        <div class="confirm-bar" id="confirmBar" style="display:none;">
          <button id="btnConfirmAction" class="success">確認執行行動</button>
        </div>
      </div>
    </div>
    <div class="log-panel">
      <h2>遊戲歷程</h2>
      <div class="log-content" id="logContent"></div>
    </div>
  </div>
</div>

<!-- ========== WIN ========== -->
<div id="winScreen" class="screen">
  <div class="win-screen">
    <h1>🏆 勝利！</h1>
    <p id="winnerText" style="font-size:1.4rem;margin:20px 0;"></p>
    <button onclick="location.reload()" class="success">再玩一次</button>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
/* ============================================================
   CARD DATA (簡化保留完整資料)
   ============================================================ */
const eventCards = [
  { name: "金融海嘯(2008)", forward: [], backward: [1, 8], desc: "全球金融市場崩盤，經濟大幅衰退。" },

  { name: "澳洲森林大火", forward: [], backward: [13, 15], desc: "極端氣候造成大規模野火。" },
  { name: "墨西哥灣漏油事故", forward: [], backward: [6, 14], desc: "鑽油平台爆炸沉沒，釀史上最嚴重漏油。" },
  { name: "山老鼠盛行", forward: [], backward: [12, 15], desc: "非法砍伐並盜運國家珍貴林木。" },

  { name: "大規模停電", forward: [], backward: [7], desc: "電力系統故障，造成大範圍供電中斷。" },
  { name: "過度包裝文化", forward: [], backward: [12, 15], desc: "商品包裝過多，增加資源浪費與垃圾量。" },

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function log(msg, type = "") {
  const el = document.getElementById("logContent");
  if (!el) return;
  const div = document.createElement("div");
  div.className = "log-entry " + type;
  div.textContent = msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function showModal(title, bodyHtml, actions) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = bodyHtml;
  const act = document.getElementById("modalActions");
  act.innerHTML = "";
  (actions || []).forEach(a => {
    const btn = document.createElement("button");
    btn.textContent = a.label;
    if (a.class) btn.className = a.class;
    btn.onclick = () => { hideModal(); a.fn(); };
    act.appendChild(btn);
  });
  document.getElementById("modal").classList.add("show");
}
function hideModal() { document.getElementById("modal").classList.remove("show"); }
function getCurrentPlayer() { return state.players[state.currentPlayer]; }
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
function randChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function generateRoomId() {

  const count = +document.getElementById("playerCount").value;
  const box = document.getElementById("nameInputs");
  box.innerHTML = "";
  for (let i = 0; i < count; i++) {

      <label>玩家 ${i+1}</label>
      <input type="text" id="pname${i}" value="${isHuman ? "玩家"+(i+1) : "AI"+(i)}" maxlength="12">
      <select id="ptype${i}">
        <option value="human" ${isHuman?"selected":""}>人類</option>
        <option value="ai" ${!isHuman?"selected":""}>AI 機器人</option>
      </select>
      <select id="pdiff${i}" ${isHuman?"disabled":""}>

function startLocalDraft() {
  const count = +document.getElementById("playerCount").value;
  const names = [], types = [], diffs = [];
  for (let i = 0; i < count; i++) {
    names.push(document.getElementById("pname"+i).value.trim() || `玩家${i+1}`);
    types.push(document.getElementById("ptype"+i).value);
    diffs.push(document.getElementById("pdiff"+i).value);
  }
  state.players = names.map((name, idx) => ({
    name, isAI: types[idx]==="ai", difficulty: diffs[idx],
    sdgs: [], hand: [], sanctioned: false, capacityNext: false
  }));
  state.draftAvailable = Array.from({length:17},(_,i)=>i+1);
  shuffle(state.draftAvailable);
  state.draftCurrentPlayer = 0;
  state.draftSelected = [];
  showScreen("draftScreen");
  renderDraft();
}

/* ============================================================
   DRAFT (一次選 2 張)
   ============================================================ */
function renderDraft() {
  const p = state.players[state.draftCurrentPlayer];
  document.getElementById("draftStatus").textContent =
    `輪到 ${p.name}${p.isAI?" (AI)":""} 挑選 2 張 SDG`;
  document.getElementById("draftCount").textContent = `已選 ${state.draftSelected.length} / 2`;

  const grid = document.getElementById("draftGrid");
  grid.innerHTML = "";
  for (let id = 1; id <= 17; id++) {
    const available = state.draftAvailable.includes(id);
    const selected = state.draftSelected.includes(id);
    const div = document.createElement("div");
    div.className = "sdg-pick" + (!available ? " disabled" : "") + (selected ? " selected" : "");
    div.innerHTML = `<strong>SDG ${id}</strong><br><span style="font-size:0.78rem;color:#94a3b8;">${SDG_NAMES[id]}</span>`;
    if (available && !p.isAI) {
      div.onclick = () => toggleDraftSelect(id);
    }
    grid.appendChild(div);
  }

  document.getElementById("draftPicks").textContent = state.players.map(pl => {
    const s = pl.sdgs.map(x => "SDG "+x.id).join(", ") || "尚未選擇";
    return `${pl.name}: ${s}`;
  }).join(" ｜ ");

  document.getElementById("btnConfirmDraft").disabled = state.draftSelected.length !== 2 || p.isAI;

  if (p.isAI) setTimeout(aiDraftPick, 700 + Math.random()*500);
}

function toggleDraftSelect(id) {
  const idx = state.draftSelected.indexOf(id);
  if (idx >= 0) {
    state.draftSelected.splice(idx, 1);
  } else {
    if (state.draftSelected.length >= 2) return;
    state.draftSelected.push(id);
  }
  renderDraft();
}

document.getElementById("btnConfirmDraft").onclick = () => {
  if (state.draftSelected.length !== 2) return;
  confirmDraftPick(state.draftSelected);
};

function confirmDraftPick(ids) {
  const p = state.players[state.draftCurrentPlayer];
  ids.forEach(id => {
    p.sdgs.push({ id, progress: 0, frozen: false, immune: false });
    state.draftAvailable = state.draftAvailable.filter(x => x !== id);
  });
  state.draftSelected = [];
  state.draftCurrentPlayer++;
  if (state.draftCurrentPlayer >= state.players.length) {
    startGameAfterDraft();
    return;
  }
  renderDraft();
}

function aiDraftPick() {
  const p = state.players[state.draftCurrentPlayer];
  if (!p.isAI || state.draftAvailable.length < 2) return;
  let picks = [];
  if (p.difficulty === "easy") {
    picks = shuffle([...state.draftAvailable]).slice(0, 2);
  } else {
    const weighted = state.draftAvailable.slice().sort((a,b)=>Math.abs(a-8.5)-Math.abs(b-8.5));
    picks = weighted.slice(0, 2);
  }
  state.draftSelected = picks;
  renderDraft();
  setTimeout(() => confirmDraftPick(picks), 600);
}

function startGameAfterDraft() {
  state.unusedSDGs = [...state.draftAvailable];
  shuffle(state.unusedSDGs);
  state.deck = [];
  eventCards.forEach(c => state.deck.push({...c, kind:"event", id:Math.random().toString(36).slice(2)}));
  specialCards.forEach(c => {
    for (let i=0;i<2;i++) state.deck.push({...c, kind:"special", id:Math.random().toString(36).slice(2)+i});
  });
  shuffle(state.deck);
  state.discard = [];
  state.players.forEach(p => {
    for (let i=0;i<5;i++) {
      if (state.deck.length===0) reshuffle();
      p.hand.push(state.deck.pop());
    }
  });
  state.currentPlayer = 0;
  state.phase = "action";
  state.modeAction = null;
  state.selectedCards = [];
  state.maxPlay = 2;
  state.capacityActive = false;
  state.isAIThinking = false;
  state.previewDeltas = {};
  showScreen("gameScreen");
  log("SDG 挑選完成，遊戲開始！", "sys");
  log(`請 ${getCurrentPlayer().name} 開始行動。`, "sys");
  updateUI();
  maybeTriggerAI();
  if (state.mode === "online" && state.isHost) broadcastState();
}

function reshuffle() {
  if (state.discard.length === 0) return;
  state.deck = state.discard.splice(0);
  shuffle(state.deck);
  log("抽牌堆用盡，棄牌堆已洗牌重來。", "sys");
}

function createRoom() {
  const name = document.getElementById("hostName").value.trim() || "房主";
  state.maxPlayers = +document.getElementById("onlinePlayerCount").value;
  state.roomId = generateRoomId();
  state.isHost = true;
  state.mode = "online";

  state.peer = new Peer(state.roomId, { debug: 1 });
  state.peer.on("open", id => {
    state.myPeerId = id;
    state.lobbyPlayers = [{ id, name, ready: true, isHost: true }];
    showScreen("lobbyScreen");
    updateLobbyUI();
  });
  state.peer.on("connection", conn => {
    setupConnection(conn);
  });
  state.peer.on("error", err => {
    alert("建立房間失敗：" + err.type);
    console.error(err);
  });
}

function joinRoom() {
  const roomId = document.getElementById("joinRoomId").value.trim().toUpperCase();
  const name = document.getElementById("joinName").value.trim() || "玩家";
  if (!roomId) { alert("請輸入房間號碼"); return; }

  state.roomId = roomId;
  state.isHost = false;
  state.mode = "online";
  state.peer = new Peer({ debug: 1 });
  state.peer.on("open", myId => {
    state.myPeerId = myId;
    const conn = state.peer.connect(roomId, { reliable: true });
    conn.on("open", () => {
      setupConnection(conn);
      conn.send({ type: "join", name, id: myId });
    });
    conn.on("error", err => alert("連線失敗：" + err));
  });
  state.peer.on("error", err => {
    alert("加入失敗，請確認房間號碼是否正確");
    console.error(err);
  });
}

function setupConnection(conn) {
  state.connections[conn.peer] = conn;
  conn.on("data", data => handleNetMessage(data, conn));
  conn.on("close", () => {
    delete state.connections[conn.peer];
    if (state.isHost) {
      state.lobbyPlayers = state.lobbyPlayers.filter(p => p.id !== conn.peer);
      broadcastLobby();
      updateLobbyUI();
    }
  });
}

function handleNetMessage(data, conn) {
  if (state.isHost) {
    // Host receives
    if (data.type === "join") {
      if (state.lobbyPlayers.length >= state.maxPlayers) {
        conn.send({ type: "error", msg: "房間已滿" });
        return;
      }
      state.lobbyPlayers.push({ id: data.id, name: data.name, ready: false, isHost: false });
      broadcastLobby();
      updateLobbyUI();
    } else if (data.type === "ready") {
      const p = state.lobbyPlayers.find(x => x.id === data.id);
      if (p) p.ready = data.ready;
      broadcastLobby();
      updateLobbyUI();
    } else if (data.type === "action") {
      // client action → host applies then broadcast
      applyClientAction(data);
    }
  } else {
    // Client receives
    if (data.type === "lobby") {
      state.lobbyPlayers = data.players;
      state.maxPlayers = data.maxPlayers;
      state.roomId = data.roomId;
      showScreen("lobbyScreen");
      updateLobbyUI();
    } else if (data.type === "start") {
      // full game init from host
      state.players = data.players;
      state.draftAvailable = data.draftAvailable;
      state.draftCurrentPlayer = 0;
      state.draftSelected = [];
      showScreen("draftScreen");
      renderDraft();
    } else if (data.type === "state") {
      // full state sync
      Object.assign(state, data.state);
      if (document.getElementById("gameScreen").classList.contains("active")) {
        updateUI();
      } else if (document.getElementById("draftScreen").classList.contains("active")) {
        renderDraft();
      }
    } else if (data.type === "error") {
      alert(data.msg);
    }
  }
}

function broadcastLobby() {
  const msg = {
    type: "lobby",
    players: state.lobbyPlayers,
    maxPlayers: state.maxPlayers,
    roomId: state.roomId
  };
  Object.values(state.connections).forEach(c => c.send(msg));
}

function updateLobbyUI() {
  document.getElementById("lobbyRoomId").textContent = state.roomId || "----";
  const list = document.getElementById("lobbyPlayers");
  list.innerHTML = "";
  state.lobbyPlayers.forEach(p => {
    const div = document.createElement("div");
    div.className = "lobby-player" + (p.ready ? " ready" : "") + (p.isHost ? " host" : "");
    div.innerHTML = `
      <span><span class="status-dot ${p.ready?"ready":"wait"}"></span>${p.name}${p.isHost?" (房主)":""}</span>
      <span style="font-size:0.85rem;color:var(--muted);">${p.ready?"已準備":"等待中"}</span>
    `;
    list.appendChild(div);
  });
  document.getElementById("lobbyStatus").textContent =
    `玩家 ${state.lobbyPlayers.length} / ${state.maxPlayers}`;

  const me = state.lobbyPlayers.find(p => p.id === state.myPeerId);
  document.getElementById("btnReady").style.display = state.isHost ? "none" : "block";
  document.getElementById("btnStartGame").style.display = state.isHost ? "block" : "none";
  if (!state.isHost && me) {
    document.getElementById("btnReady").textContent = me.ready ? "取消準備" : "準備就緒 (Ready)";
  }
  if (state.isHost) {
    const allReady = state.lobbyPlayers.length >= 2 && state.lobbyPlayers.every(p => p.ready || p.isHost);
    document.getElementById("btnStartGame").disabled = !allReady || state.lobbyPlayers.length < 2;
  }
}

function toggleReady() {
  const me = state.lobbyPlayers.find(p => p.id === state.myPeerId);
  if (!me) return;
  const newReady = !me.ready;
  // send to host
  const hostConn = Object.values(state.connections)[0];
  if (hostConn) hostConn.send({ type: "ready", id: state.myPeerId, ready: newReady });
}

function hostStartGame() {
  if (!state.isHost) return;
  // create players from lobby (all human)
  state.players = state.lobbyPlayers.map(p => ({
    name: p.name, isAI: false, difficulty: "basic",
    sdgs: [], hand: [], sanctioned: false, capacityNext: false,
    peerId: p.id
  }));
  state.draftAvailable = Array.from({length:17},(_,i)=>i+1);
  shuffle(state.draftAvailable);
  state.draftCurrentPlayer = 0;
  state.draftSelected = [];

  const msg = {
    type: "start",
    players: state.players,
    draftAvailable: state.draftAvailable
  };
  Object.values(state.connections).forEach(c => c.send(msg));
  showScreen("draftScreen");
  renderDraft();
}

function leaveLobby() {
  if (state.peer) state.peer.destroy();
  state.peer = null;
  state.connections = {};
  state.lobbyPlayers = [];
  showScreen("onlineMenu");
}

function broadcastState() {
  if (!state.isHost) return;
  const msg = {
    type: "state",
    state: {
      players: state.players,
      currentPlayer: state.currentPlayer,
      phase: state.phase,
      deck: state.deck,
      discard: state.discard,
      unusedSDGs: state.unusedSDGs,
      draftAvailable: state.draftAvailable,
      draftCurrentPlayer: state.draftCurrentPlayer,
      draftSelected: state.draftSelected
    }
  };
  Object.values(state.connections).forEach(c => c.send(msg));
}

function applyClientAction(data) {
  // simplified: host trusts client for draft/action, then rebroadcast
  // In production would validate more strictly
  if (data.action === "draftSelect") {
    state.draftSelected = data.ids;
    broadcastState();
    renderDraft();
  } else if (data.action === "draftConfirm") {
    confirmDraftPick(data.ids);
    broadcastState();
  }
  // more actions can be added similarly
}

/* ============================================================
   GAME UI + LOGIC (core remains compatible)
   ============================================================ */
function computePreview() {
  state.previewDeltas = {};
  const p = getCurrentPlayer();
  if (state.modeAction !== "play" || state.selectedCards.length === 0 || p.isAI) return;
  state.selectedCards.forEach(idx => {
    const card = p.hand[idx];
    if (!card || card.kind !== "event") return;
    card.forward.forEach(sdgId => {
      state.players.forEach((pl, pi) => {
        pl.sdgs.forEach((s, si) => {
          if (s.id === sdgId && s.progress < 3 && !s.frozen) {
            if (!state.previewDeltas[pi]) state.previewDeltas[pi] = {};
            state.previewDeltas[pi][si] = (state.previewDeltas[pi][si] || 0) + 1;
          }
        });
      });
    });
    card.backward.forEach(sdgId => {
      state.players.forEach((pl, pi) => {
        pl.sdgs.forEach((s, si) => {
          if (s.id === sdgId && s.progress < 3 && !s.frozen && !s.immune) {
            if (!state.previewDeltas[pi]) state.previewDeltas[pi] = {};
            state.previewDeltas[pi][si] = (state.previewDeltas[pi][si] || 0) - 1;
          }
        });
      });
    });
  });
}

function updateUI() {
  const p = getCurrentPlayer();
  if (!p) return;
  document.getElementById("turnInfo").textContent = `目前回合：${p.name}${p.isAI ? " (AI)" : ""}`;
  document.getElementById("deckCount").textContent = state.deck.length;
  document.getElementById("discardCount").textContent = state.discard.length;
  document.getElementById("handCount").textContent = `(${p.hand.length}/5)`;

  let phaseText = "行動階段：請選擇「棄牌」或「打出卡牌」";
  if (state.isAIThinking) phaseText = "AI 思考中...";
  else if (state.modeAction === "discard") phaseText = "棄牌模式：選擇要棄掉的手牌，再按確認";
  else if (state.modeAction === "play") phaseText = `打牌模式：選擇最多 ${state.maxPlay} 張牌，再按確認`;
  document.getElementById("phaseLabel").textContent = phaseText;
  document.getElementById("phaseLabel").className = "phase-label" + (state.isAIThinking ? " ai-thinking" : "");

  const humanTurn = !p.isAI && state.phase === "action" && !state.isAIThinking;
  const btnDiscard = document.getElementById("btnDiscardMode");
  const btnPlay = document.getElementById("btnPlayMode");
  const btnCancel = document.getElementById("btnCancelAction");
  const confirmBar = document.getElementById("confirmBar");

  if (humanTurn && !state.modeAction) {
    btnDiscard.style.display = "";
    btnPlay.style.display = "";
    btnCancel.style.display = "none";
    confirmBar.style.display = "none";
  } else if (humanTurn && (state.modeAction === "discard" || state.modeAction === "play")) {
    btnDiscard.style.display = "none";
    btnPlay.style.display = "none";
    btnCancel.style.display = "";
    confirmBar.style.display = state.selectedCards.length > 0 ? "flex" : "none";
  } else {
    btnDiscard.style.display = "none";
    btnPlay.style.display = "none";
    btnCancel.style.display = "none";
    confirmBar.style.display = "none";
  }

  computePreview();

  const grid = document.getElementById("playersGrid");
  grid.innerHTML = "";
  state.players.forEach((pl, idx) => {
    const div = document.createElement("div");
    div.className = "player-card" + (idx === state.currentPlayer ? " current" : "") +
      (pl.sanctioned ? " sanctioned" : "") + (pl.isAI ? " ai-tag" : "");
    let html = `<div class="player-name">${pl.name}${idx === state.currentPlayer ? " ▶" : ""}${pl.isAI ? " ["+pl.difficulty+"]" : ""}</div>`;
    pl.sdgs.forEach((s, si) => {
      const cur = s.progress;
      const delta = (state.previewDeltas[idx] && state.previewDeltas[idx][si]) || 0;
      const preview = clamp(cur + delta, -2, 3);
      const pct = ((cur + 2) / 5) * 100;
      const previewPct = ((preview + 2) / 5) * 100;
      const isNeg = cur < 0;
      html += `<div class="sdg-row">
        <div class="sdg-badge ${cur>=3?"goal":""} ${s.frozen?"frozen":""}">SDG ${s.id}</div>
        <div class="progress-bar">
          <div class="progress-fill ${isNeg?"negative":""}" style="width:${pct}%"></div>
          ${delta !== 0 ? `<div class="progress-preview ${delta<0?"negative":""}" style="left:0;width:${Math.max(pct,previewPct)}%;"></div>` : ""}
          <div class="progress-text">${cur>=3?"GOAL":cur}${delta?` →${preview}`:""}${s.frozen?" ❄":""}${s.immune?" 🛡":""}</div>
        </div>
      </div>
      <div style="font-size:0.7rem;color:#64748b;margin-bottom:4px;">${SDG_NAMES[s.id]||""}</div>`;
    });
    div.innerHTML = html;
    grid.appendChild(div);
  });

  const handEl = document.getElementById("handCards");
  handEl.innerHTML = "";
  p.hand.forEach((card, idx) => {
    const isVeto = card.kind === "special" && card.type === "veto";
    const cannotPlay = state.modeAction === "play" && isVeto;
    const div = document.createElement("div");
    div.className = "card " + (card.kind==="event"?"event":"special") +
      (state.selectedCards.includes(idx)?" selected":"") + (cannotPlay?" disabled-card":"");
    let effect = "";
    if (card.kind === "event") {
      effect = `<div class="card-fwd">${card.forward.length?"前進："+card.forward.join(","):""}</div>
                <div class="card-bwd">${card.backward.length?"後退："+card.backward.join(","):""}</div>`;
    } else {
      effect = `<div class="card-effect">${card.desc}</div>`;
    }
    div.innerHTML = `<div class="card-name">${card.name}</div>${effect}`;
    if (!p.isAI && !cannotPlay) div.onclick = () => onCardClick(idx);
    handEl.appendChild(div);
  });
}

/* Action buttons */
document.getElementById("btnDiscardMode").onclick = () => {
  state.modeAction = "discard";
  state.selectedCards = [];
  updateUI();
};
document.getElementById("btnPlayMode").onclick = () => {
  state.modeAction = "play";
  state.maxPlay = getCurrentPlayer().sanctioned ? 1 : 2;
  state.selectedCards = [];
  updateUI();
};
document.getElementById("btnCancelAction").onclick = () => {
  state.modeAction = null;
  state.selectedCards = [];
  state.previewDeltas = {};
  updateUI();
};
document.getElementById("btnConfirmAction").onclick = () => {
  if (state.selectedCards.length === 0) return;
  if (state.modeAction === "discard") executeDiscard();
  else if (state.modeAction === "play") executePlay();
};

function onCardClick(idx) {
  if (state.phase !== "action" || !state.modeAction || getCurrentPlayer().isAI) return;
  const card = getCurrentPlayer().hand[idx];
  if (state.modeAction === "play" && card.type === "veto") return;

  if (state.modeAction === "discard") {
    const pos = state.selectedCards.indexOf(idx);
    if (pos >= 0) state.selectedCards.splice(pos, 1);
    else state.selectedCards.push(idx);
  } else {
    const pos = state.selectedCards.indexOf(idx);
    if (pos >= 0) state.selectedCards.splice(pos, 1);
    else {
      if (state.selectedCards.length >= state.maxPlay) state.selectedCards.shift();
      state.selectedCards.push(idx);
    }
  }
  updateUI();
}

function executeDiscard() {
  const p = getCurrentPlayer();
  [...state.selectedCards].sort((a,b)=>b-a).forEach(i => {
    const card = p.hand.splice(i, 1)[0];
    state.discard.push(card);
    log(`${p.name} 棄掉了「${card.name}」。`);
  });
  state.selectedCards = [];
  state.modeAction = null;
  endActionPhase();
}

async function executePlay() {
  const p = getCurrentPlayer();
  const sorted = [...state.selectedCards].sort((a,b)=>b-a);
  const cards = [];
  sorted.forEach(i => cards.unshift(p.hand.splice(i,1)[0]));
  cards.forEach(c => state.discard.push(c));
  state.selectedCards = [];
  state.modeAction = null;
  for (const card of cards) {
    log(`${p.name} 打出「${card.name}」。`);
    updateUI();
    await new Promise(r => resolveCard(card, false, r));
    await delay(300);
  }
  endActionPhase();
}

function endActionPhase() {
  state.modeAction = null;
  state.selectedCards = [];
  getCurrentPlayer().sdgs.forEach(s => s.immune = false);
  state.phase = "draw";
  doDrawPhase();
}

function doDrawPhase() {
  const p = getCurrentPlayer();
  let need = 5 - p.hand.length;
  if (p.capacityNext) { need += 1; p.capacityNext = false; state.capacityActive = true; }
  const drawn = [];
  for (let i=0; i<need; i++) {
    if (state.deck.length===0) reshuffle();
    if (state.deck.length===0) break;
    drawn.push(state.deck.pop());
  }
  if (state.capacityActive && drawn.length > 0) {
    state.capacityActive = false;
    if (p.isAI) {
      const i = Math.floor(Math.random()*drawn.length);
      state.discard.push(drawn.splice(i,1)[0]);
      p.hand.push(...drawn);
      finishTurn();
    } else {
      showModal("能力建構：選擇一張棄置", drawn.map((c,i)=>`<button data-i="${i}">${c.name}</button>`).join(""), []);
      setTimeout(() => {
        document.querySelectorAll("#modalBody button").forEach(btn => {
          btn.onclick = () => {
            const i = +btn.dataset.i;
            state.discard.push(drawn.splice(i,1)[0]);
            p.hand.push(...drawn);
            hideModal();
            finishTurn();
          };
        });
      }, 50);
    }
  } else {
    p.hand.push(...drawn);
    if (drawn.length) log(`${p.name} 補了 ${drawn.length} 張牌。`);
    finishTurn();
  }
}

function finishTurn() {
  const next = (state.currentPlayer + 1) % state.players.length;
  getCurrentPlayer().sanctioned = false;
  state.players[next].sdgs.forEach(s => s.frozen = false);
  state.currentPlayer = next;
  state.phase = "action";
  state.modeAction = null;
  log(`── 輪到 ${getCurrentPlayer().name} ──`, "sys");
  checkWin();
  updateUI();
  maybeTriggerAI();
  if (state.mode === "online" && state.isHost) broadcastState();
}

/* AI (簡化保留 Advance 強化版核心) */
async function maybeTriggerAI() {
  const p = getCurrentPlayer();
  if (!p || !p.isAI || state.phase !== "action") return;
  state.isAIThinking = true;
  updateUI();
  await delay(900 + Math.random()*500);
  await executeAIMove(p);
  state.isAIThinking = false;
}

function getAIBestMove(ai, diff) {
  if (diff === "easy") {
    const play = Math.random() < 0.8;
    if (!play) return { action:"discard", indices: shuffle([...Array(ai.hand.length).keys()]).slice(0,2) };
    const playable = ai.hand.map((c,i)=>i).filter(i => ai.hand[i].type !== "veto");
    return { action:"play", indices: shuffle(playable).slice(0, ai.sanctioned?1:2) };
  }
  // basic / advance simplified
  const scores = ai.hand.map((c,i) => ({i, s: c.type==="veto"?-50 : (c.kind==="event"?15:8)}));
  scores.sort((a,b)=>b.s-a.s);
  const maxP = ai.sanctioned ? 1 : 2;
  if (scores[0].s > 0) return { action:"play", indices: scores.slice(0,maxP).map(x=>x.i) };
  return { action:"discard", indices: scores.slice(-2).map(x=>x.i) };
}

async function executeAIMove(ai) {
  const move = getAIBestMove(ai, ai.difficulty);
  if (move.action === "discard") {
    [...move.indices].sort((a,b)=>b-a).forEach(i => {
      if (i < ai.hand.length) {
        const c = ai.hand.splice(i,1)[0];
        state.discard.push(c);
        log(`${ai.name} 棄掉「${c.name}」`, "ai");
      }
    });
    endActionPhase();
    return;
  }
  const cards = [];
  [...move.indices].sort((a,b)=>b-a).forEach(i => {
    if (i < ai.hand.length) cards.unshift(ai.hand.splice(i,1)[0]);
  });
  cards.forEach(c => state.discard.push(c));
  for (const card of cards) {
    log(`${ai.name} 打出「${card.name}」`, "ai");
    updateUI();
    await new Promise(r => resolveCard(card, true, r));
    await delay(350);
  }
  endActionPhase();
}

/* Card resolution (核心保留，精簡部分特殊卡以控制長度) */
function isValidNegativeTarget(s) { return s.progress < 3 && !s.immune && !s.frozen; }

function resolveCard(card, isAI, done) {
  if (card.kind === "event") resolveEvent(card, isAI, done);
  else resolveSpecial(card, isAI, done);
}

function resolveEvent(card, isAI, done) {
  card.forward.forEach(id => {
    state.players.forEach(pl => {
      pl.sdgs.forEach(s => {
        if (s.id === id && s.progress < 3 && !s.frozen) {
          s.progress = clamp(s.progress+1, -2, 3);
          log(`${pl.name} 的 SDG ${id} 前進至 ${s.progress}！`);
        }
      });
    });
  });
  if (card.backward.length === 0) { done(); return; }
  const targets = [];
  state.players.forEach((pl,pi) => {
    pl.sdgs.forEach((s,si) => {
      if (card.backward.includes(s.id) && isValidNegativeTarget(s)) targets.push({pl,s,pi,si});
    });
  });
  if (targets.length === 0) { log("後退無有效目標"); done(); return; }
  let i = 0;
  function next() {
    if (i >= targets.length) { done(); return; }
    const t = targets[i++];
    const vIdx = t.pl.hand.findIndex(c => c.type === "veto");
    if (vIdx >= 0 && !t.pl.isAI) {
      showModal("否決權", `<p>${t.pl.name} 的 SDG ${t.s.id} 即將後退，是否使用否決權？</p>`, [
        {label:"使用", class:"success", fn:()=>{ t.pl.hand.splice(vIdx,1); state.discard.push({type:"veto"}); log(`${t.pl.name} 使用否決權`); next(); }},
        {label:"不使用", class:"danger", fn:()=>{ t.s.progress=clamp(t.s.progress-1,-2,3); log(`${t.pl.name} SDG ${t.s.id} → ${t.s.progress}`); next(); }}
      ]);
    } else {
      if (vIdx >= 0 && t.pl.isAI && t.pl.difficulty === "advance") {
        t.pl.hand.splice(vIdx,1);
        log(`${t.pl.name} (AI) 使用否決權`, "ai");
      } else {
        t.s.progress = clamp(t.s.progress-1, -2, 3);
        log(`${t.pl.name} 的 SDG ${t.s.id} 後退至 ${t.s.progress}`);
      }
      next();
    }
  }
  next();
}

function resolveSpecial(card, isAI, done) {
  const p = getCurrentPlayer();
  // 簡化實作：多數特殊卡自動或彈窗選擇
  if (card.type === "capacity") {
    p.capacityNext = true;
    log(`${p.name} 獲得能力建構`);
    done();
  } else if (card.type === "immunity") {
    if (isAI) {
      p.sdgs[0].immune = true;
      log(`${p.name} (AI) 獲得豁免`);
      done();
    } else {
      showModal("政策豁免", p.sdgs.map((s,i)=>`<button data-i="${i}">SDG ${s.id}</button>`).join(""), []);
      setTimeout(() => {
        document.querySelectorAll("#modalBody button").forEach(btn => {
          btn.onclick = () => {
            p.sdgs[+btn.dataset.i].immune = true;
            hideModal();
            done();
          };
        });
      }, 30);
    }
  } else if (card.type === "freeze") {
    // 簡化：打最高進度的非GOAL對手
    let best = null;
    state.players.forEach((pl,pi) => {
      if (pl === p) return;
      pl.sdgs.forEach((s,si) => {
        if (isValidNegativeTarget(s) && (!best || s.progress > best.progress)) best = {pl,s,si};
      });
    });
    if (best) {
      best.s.frozen = true;
      log(`${p.name} 凍結了 ${best.pl.name} 的 SDG ${best.s.id}`);
    }
    done();
  } else if (card.type === "sanction") {
    let best = null, max = -99;
    state.players.forEach(pl => {
      if (pl === p) return;
      const t = pl.sdgs.reduce((a,s)=>a+s.progress,0);
      if (t > max) { max = t; best = pl; }
    });
    if (best) { best.sanctioned = true; log(`${p.name} 制裁了 ${best.name}`); }
    done();
  } else {
    log(`「${card.name}」效果已觸發（簡化處理）`);
    done();
  }
}

function checkWin() {
  for (const pl of state.players) {
    if (pl.sdgs.every(s => s.progress >= 3)) {
      showScreen("winScreen");
      document.getElementById("winnerText").textContent = `${pl.name} 率先完成兩項 SDG 目標！`;
      log(`🏆 ${pl.name} 獲勝！`, "win");
      return;
    }
  }
}
